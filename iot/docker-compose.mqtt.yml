# CASTÚO-SYSTEM — MQTT + Edge (finca / integración Hetzner)
# Uso: docker-compose -f iot/docker-compose.mqtt.yml up -d
# O con stack principal: docker-compose -f docker-compose.hetzner.yml --profile iot up -d
version: '3.9'

services:
  mqtt:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - mqtt_data:/mosquitto/data
    restart: unless-stopped

  rpi-edge:
    build:
      context: ..
      dockerfile: iot/docker/Dockerfile.rpi
    depends_on:
      - mqtt
    environment:
      - MQTT_BROKER=mqtt
      - MQTT_PORT=1883
      - BACKEND_URL=${BACKEND_URL:-http://host.docker.internal:8001}
    restart: unless-stopped

volumes:
  mqtt_data:
