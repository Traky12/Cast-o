# ─────────────────────────────────────────────────────────────────────────────
# CASTÚO-SYSTEM™ v3.1 — Mosquitto MQTT Broker
# eclipse-mosquitto:2.0
# ─────────────────────────────────────────────────────────────────────────────

# ── Listener TCP (sensores IoT, RPi, actuadores) ──────────────────────────────
listener 1883
allow_anonymous true

# ── Listener WebSocket (frontend browser) ────────────────────────────────────
listener 9001
protocol websockets
allow_anonymous true

# ── Persistencia ──────────────────────────────────────────────────────────────
persistence true
persistence_location /mosquitto/data/
persistence_file mosquitto.db
autosave_interval 30

# ── Logging ───────────────────────────────────────────────────────────────────
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_timestamp true

# ── Keep-alive y QoS ─────────────────────────────────────────────────────────
max_keepalive 120
max_queued_messages 1000
max_inflight_messages 100
