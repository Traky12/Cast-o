# Mosquitto cloud config — CASTÚO-SYSTEM IoT bridge
# Used by the iot-bridge service in docker-compose.cloud.yml.
#
# Certs (server.crt / server.key / ca.crt) must be provisioned at deploy time
# in the ./certs/ directory (gitignored). Generate self-signed for staging:
#
#   openssl req -newkey rsa:4096 -x509 -days 365 -nodes \
#     -keyout certs/server.key -out certs/server.crt \
#     -subj "/CN=iot-bridge"
#   cp certs/server.crt certs/ca.crt

# ------------------------------------------------------------------
# Listener 1883 – plain MQTT for internal sensors (local network only)
# ------------------------------------------------------------------
listener 1883
protocol mqtt
allow_anonymous false
password_file /mosquitto/config/passwd

# ------------------------------------------------------------------
# Listener 8883 – TLS MQTT for external sensors (WL SIMs)
# ------------------------------------------------------------------
listener 8883
protocol mqtt
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
require_certificate false
allow_anonymous false
password_file /mosquitto/config/passwd

# ------------------------------------------------------------------
# Persistence & logging
# ------------------------------------------------------------------
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice
