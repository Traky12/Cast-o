# Umbrales de referencia Extremadura (parametrización interna; validar con asesor agro/normativo).
# No publica métricas Prometheus; la lógica de negocio lee este YAML vía backend/ctaex/climate_config.py
temperature:
  heatwave: 42
  frost: 0
  optimal_range:
    min: 18
    max: 32

humidity:
  low: 20
  high: 85
  optimal_range:
    min: 40
    max: 70

solar_radiation:
  high: 1100
  optimal_range:
    min: 400
    max: 900

wind_speed:
  moderate: 5
  high: 10
  extreme: 15

precipitation:
  drought: 5
  heavy_rain: 30

et0:
  high: 8
  optimal_range:
    spring: { min: 3, max: 6 }
    summer: { min: 5, max: 9 }
    autumn: { min: 2, max: 5 }
    winter: { min: 1, max: 3 }

# Ajustes por cultivo (opcional); fusión sobre temperature / humidity / et0 en check_violation(..., crop_type="...")
crop_specific:
  cannabis_medicinal:
    temperature:
      heatwave: 40
      frost: 2
    et0:
      high: 6
  tomate_raf:
    temperature:
      heatwave: 41
      frost: 1
    et0:
      high: 7
  vid:
    temperature:
      heatwave: 40
      frost: -1
    et0:
      high: 7.5
  cereales:
    temperature:
      heatwave: 41
      frost: -2
    et0:
      high: 7
