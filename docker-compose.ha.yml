version: '3.9'
services:
  timescaledb-primary:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: castuo_telemetry
      POSTGRES_USER: castuo_iot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - timescaledb-primary:/var/lib/postgresql/data
      - ./infrastructure/timescaledb/timescaledb-init.sql:/docker-entrypoint-initdb.d/init.sql
    command: |
      postgres
      -c max_wal_senders=10
      -c max_replication_slots=10
      -c wal_level=replica
      -c hot_standby=on
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U castuo_iot"]
      interval: 10s
      timeout: 5s
      retries: 5

  timescaledb-standby:
    image: timescale/timescaledb:latest-pg16
    environment:
      PGUSER: castuo_iot
    ports:
      - "5435:5432"
    volumes:
      - timescaledb-standby:/var/lib/postgresql/data
    command: |
      bash -c "
      pg_basebackup -h timescaledb-primary -D /var/lib/postgresql/data -U castuo_iot -v -P -W &&
      echo 'standby_mode = on' > /var/lib/postgresql/data/recovery.conf &&
      postgres
      "
    depends_on:
      timescaledb-primary:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U castuo_iot"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  timescaledb-primary:
  timescaledb-standby:
