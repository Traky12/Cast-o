apiVersion: apps/v1
kind: Deployment
metadata:
  name: castuo-backend
  namespace: castuo-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app: castuo-backend
  template:
    metadata:
      labels:
        app: castuo-backend
    spec:
      containers:
      - name: backend
        image: ghcr.io/castuo-system/backend:v1.4.0
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: castuo-config
        resources:
          limits:
            cpu: "1"
            memory: "1Gi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
