# Deployment de producción: coordinador FL seguro
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: traceability-pvc
  namespace: castuo-prod
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: secure-federated-coordinator
  namespace: castuo-prod
  labels:
    app: secure-federated-coordinator
spec:
  replicas: 3
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: secure-federated-coordinator
  template:
    metadata:
      labels:
        app: secure-federated-coordinator
    spec:
      containers:
      - name: coordinator
        image: ghcr.io/tu-organizacion/castuo-system:v2.1-prod
        imagePullPolicy: Always
        envFrom:
        - configMapRef:
            name: encryption-config
        volumeMounts:
        - name: encryption-keys
          mountPath: /etc/encryption-keys
          readOnly: true
        - name: traceability-data
          mountPath: /var/traceability
        resources:
          limits:
            cpu: "2"
            memory: "2Gi"
          requests:
            cpu: "1"
            memory: "1Gi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: encryption-keys
        secret:
          secretName: he-keys
      - name: traceability-data
        persistentVolumeClaim:
          claimName: traceability-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: secure-federated-coordinator
  namespace: castuo-prod
spec:
  selector:
    app: secure-federated-coordinator
  ports:
  - port: 8000
    targetPort: 8000
    name: http
