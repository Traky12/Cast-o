# Generación de informes de auditoría (semanal: domingo 02:00)
apiVersion: batch/v1
kind: CronJob
metadata:
  name: audit-report
  namespace: castuo-prod
spec:
  schedule: "0 2 * * 0"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: auditor
            image: ghcr.io/tu-organizacion/castuo-system:v2.1-prod
            command: ["python", "-m", "backend.scripts.generate_audit_report"]
            args: ["--period", "7", "--output", "/var/traceability/prod_audit_7days.json"]
            volumeMounts:
            - name: traceability-data
              mountPath: /var/traceability
          restartPolicy: OnFailure
          volumes:
          - name: traceability-data
            persistentVolumeClaim:
              claimName: traceability-pvc
