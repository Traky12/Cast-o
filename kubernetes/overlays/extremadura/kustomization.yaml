apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patchesStrategicMerge:
  - deployment-patch.yaml
configMapGenerator:
  - name: castuo-config
    literals:
      - PORT_HIDRO=8001
      - DB_URL=postgresql://user:pass@postgres-extremadura:5432/castuo
      - LEGAL_FRAMEWORK=PAC_2040,AI_Act_2024,GDPR
      - REGION=extremadura
