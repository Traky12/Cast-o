{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "castuo-system.fullname" . }}
  labels:
    {{- include "castuo-system.labels" . | nindent 4 }}
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/rewrite-target: /
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  tls:
    - hosts:
        - api.{{ .Values.domain }}
        - agents.{{ .Values.domain }}
      secretName: {{ include "castuo-system.fullname" . }}-tls
  rules:
    - host: api.{{ .Values.domain }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "castuo-system.fullname" . }}-backend
                port:
                  number: {{ .Values.backend.servicePort | default 8000 }}
    - host: agents.{{ .Values.domain }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "castuo-system.fullname" . }}-master-agent
                port:
                  number: 8000
{{- end }}
