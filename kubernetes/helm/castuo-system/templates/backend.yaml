apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "castuo-system.fullname" . }}-backend
  labels:
    {{- include "castuo-system.labels" . | nindent 4 }}
    component: backend
spec:
  replicas: {{ .Values.backend.replicas | default 2 }}
  selector:
    matchLabels:
      app: {{ include "castuo-system.name" . }}
      component: backend
  template:
    metadata:
      labels:
        app: {{ include "castuo-system.name" . }}
        component: backend
        {{- include "castuo-system.labels" . | nindent 8 }}
    spec:
      containers:
        - name: backend
          image: "{{ .Values.agents.image.repository }}:{{ .Values.agents.image.tag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: {{ .Values.backend.servicePort | default 8000 }}
              name: http
          env:
            - name: RABBITMQ_HOST
              value: "{{ .Release.Name }}-rabbitmq"
          resources:
            limits:
              cpu: "1"
              memory: "1Gi"
            requests:
              cpu: "100m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "castuo-system.fullname" . }}-backend
  labels:
    {{- include "castuo-system.labels" . | nindent 4 }}
    component: backend
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.backend.servicePort | default 8000 }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: {{ include "castuo-system.name" . }}
    component: backend
