# Secret para claves de cifrado (RSA + HE / Kyber).
# Generar y aplicar con:
#   python -c "
#   from backend.security.end_to_end_encryption import EndToEndEncryption
#   e = EndToEndEncryption()
#   priv, pub = e.generate_key_pair()
#   import base64
#   print('private-key.pem:', base64.b64encode(priv).decode())
#   print('public-key.pem:', base64.b64encode(pub).decode())
#   "
#   kubectl create secret generic he-keys -n castuo \
#     --from-file=private-key.pem --from-file=public-key.pem \
#     --from-file=kyber-private.key --from-file=kyber-public.key
# O sustituir los valores <base64_...> y aplicar este manifiesto.
apiVersion: v1
kind: Secret
metadata:
  name: he-keys
  namespace: castuo
type: Opaque
data:
  # Sustituir por salida de base64 -w 0 private-key.pem (y resto)
  # private-key.pem: <base64_encoded_private_key>
  # public-key.pem: <base64_encoded_public_key>
  # kyber-private.key: <base64_encoded_kyber_private>
  # kyber-public.key: <base64_encoded_kyber_public>
