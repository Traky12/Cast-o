# Prometheus federado (cluster central). Recopila métricas de latam y asia.
global:
  scrape_interval: 15s
  external_labels:
    region: eu

scrape_configs:
  - job_name: 'federate'
    honor_labels: true
    metrics_path: '/federate'
    static_configs:
      - targets:
        - 'prometheus-latam:9090'
        - 'prometheus-asia:9090'
        - 'prometheus-africa:9090'
        - 'prometheus-oceania:9090'
        - 'prometheus-extremadura:9090'
