# Deployment del coordinador Federated Learning con HE habilitado
apiVersion: apps/v1
kind: Deployment
metadata:
  name: he-federated-coordinator
  namespace: castuo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: he-federated-coordinator
  template:
    metadata:
      labels:
        app: he-federated-coordinator
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
    spec:
      containers:
      - name: coordinator
        image: ghcr.io/tu-organizacion/castuo-system:v2.1
        command: ["python", "-m", "backend.agents.master_agent"]
        env:
        - name: USE_HE
          value: "true"
        - name: OPTIMIZE_HE
          valueFrom:
            configMapKeyRef:
              name: he-config
              key: OPTIMIZE_HE
        - name: HE_SCHEME
          valueFrom:
            configMapKeyRef:
              name: he-config
              key: SCHEME
        - name: CACHE_TTL
          valueFrom:
            configMapKeyRef:
              name: he-config
              key: CACHE_TTL
        ports:
        - containerPort: 8000
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          limits:
            cpu: "2"
            memory: "1Gi"
          requests:
            cpu: "1"
            memory: "512Mi"
        volumeMounts:
        - name: he-keys
          mountPath: /etc/he-keys
      volumes:
      - name: he-keys
        secret:
          secretName: he-keys
