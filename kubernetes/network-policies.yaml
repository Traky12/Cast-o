# Network Policies estrictas para el coordinador FL en producción.
# Requiere que los namespaces monitoring y gaiachain tengan label name: monitoring / name: gaiachain.
# RabbitMQ: si usas Helm Bitnami, el selector puede ser app.kubernetes.io/name: rabbitmq;
# ajustar podSelector si tu release usa otras etiquetas.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: fl-coordinator-policy
  namespace: castuo-prod
spec:
  podSelector:
    matchLabels:
      app: secure-federated-coordinator
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: secure-federated-coordinator
        - namespaceSelector:
            matchLabels:
              name: monitoring
      ports:
        - protocol: TCP
          port: 8000
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: rabbitmq
      ports:
        - protocol: TCP
          port: 5672
    - to:
        - namespaceSelector:
            matchLabels:
              name: gaiachain
      ports:
        - protocol: TCP
          port: 8080
    - to:
        - namespaceSelector:
            matchLabels:
              name: monitoring
      ports:
        - protocol: TCP
          port: 9090
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: defense-system-policy
  namespace: castuo-prod
spec:
  podSelector:
    matchLabels:
      app: defense-system
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: secure-federated-coordinator
        - namespaceSelector:
            matchLabels:
              name: monitoring
      ports:
        - protocol: TCP
          port: 8000
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: rabbitmq
      ports:
        - protocol: TCP
          port: 5672
    - to:
        - namespaceSelector:
            matchLabels:
              name: gaiachain
      ports:
        - protocol: TCP
          port: 8080
    - to:
        - namespaceSelector:
            matchLabels:
              name: monitoring
      ports:
        - protocol: TCP
          port: 9090
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 80
