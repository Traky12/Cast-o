# Ejemplo: Postgres + Directus (headless CMS) para contenido editorial y API REST/GraphQL.
# No es el stack de producción único del monorepo; combina con n8n vía HTTP y token estático.
#
#   cp .env.directus.example .env.directus
#   docker compose -f docker-compose.directus.example.yml --env-file .env.directus up -d
#
# Crea colecciones y un usuario con token estático en Directus; n8n usa DIRECTUS_URL + DIRECTUS_STATIC_TOKEN.

services:
  directus-postgres:
    image: postgres:16-alpine
    container_name: castuo-directus-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DIRECTUS_DB_USER:-directus}
      POSTGRES_PASSWORD: ${DIRECTUS_DB_PASSWORD:?set DIRECTUS_DB_PASSWORD}
      POSTGRES_DB: ${DIRECTUS_DB_NAME:-directus}
    volumes:
      - directus_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DIRECTUS_DB_USER:-directus} -d ${DIRECTUS_DB_NAME:-directus}"]
      interval: 5s
      timeout: 5s
      retries: 5

  directus:
    image: directus/directus:11
    container_name: castuo-directus
    restart: unless-stopped
    depends_on:
      directus-postgres:
        condition: service_healthy
    ports:
      - "${DIRECTUS_PORT:-8055}:8055"
    environment:
      KEY: ${DIRECTUS_KEY:?set DIRECTUS_KEY}
      SECRET: ${DIRECTUS_SECRET:?set DIRECTUS_SECRET}
      DB_CLIENT: pg
      DB_HOST: directus-postgres
      DB_PORT: 5432
      DB_DATABASE: ${DIRECTUS_DB_NAME:-directus}
      DB_USER: ${DIRECTUS_DB_USER:-directus}
      DB_PASSWORD: ${DIRECTUS_DB_PASSWORD:?set DIRECTUS_DB_PASSWORD}
      ADMIN_EMAIL: ${DIRECTUS_ADMIN_EMAIL:?set DIRECTUS_ADMIN_EMAIL}
      ADMIN_PASSWORD: ${DIRECTUS_ADMIN_PASSWORD:?set DIRECTUS_ADMIN_PASSWORD}
      PUBLIC_URL: ${DIRECTUS_PUBLIC_URL:-http://localhost:8055}

volumes:
  directus_pg_data:
