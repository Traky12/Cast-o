# CASTUO-SYSTEM™ | Prometheus + Grafana + git-exporter + Alertmanager
# Ejecutar desde castu-monitoring: docker-compose up -d
# Montar el repo en git-exporter: ajustar volumen (abajo .. = raíz del repo si castu-monitoring está dentro)

version: '3.8'

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: castu-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus/rules:/etc/prometheus/rules
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--web.enable-lifecycle'
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: castu-grafana
    ports:
      - "3001:3000"
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards/castu
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=castuo123
    restart: unless-stopped

  # git-exporter: un contenedor por repo/granja. Ajustar volúmenes a rutas reales.
  git-exporter:
    image: prometheuscommunity/git-exporter:latest
    container_name: castu-git-exporter
    ports:
      - "9091:9091"
    volumes:
      - ..:/repo
    command:
      - '--repo.path=/repo'
      - '--repo.name=castu-system'
      - '--log.level=debug'
    restart: unless-stopped

  # Segunda granja (mismo repo para demo; en producción usar - /ruta/a/granjas/castu-finca2:/repo2)
  git-exporter-finca2:
    image: prometheuscommunity/git-exporter:latest
    container_name: castu-git-exporter-finca2
    ports:
      - "9092:9091"
    volumes:
      - ..:/repo2
    command:
      - '--repo.path=/repo2'
      - '--repo.name=castu-finca2'
      - '--log.level=info'
    restart: unless-stopped
    profiles:
      - multirepo

  alertmanager:
    image: prom/alertmanager:latest
    container_name: castu-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ../monitor/alertmanager.yml:/etc/alertmanager/alertmanager.yml
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
    restart: unless-stopped

volumes:
  grafana-storage:
