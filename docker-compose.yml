version: '3.9'

services:
  api:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - PYTHONPATH=/app
      - ENVIRONMENT=development
      - MISTRAL_API_URL=${MISTRAL_API_URL}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY}
      - VECHAIN_GATEWAY_URL=${VECHAIN_GATEWAY_URL}
      - VECHAIN_API_KEY=${VECHAIN_API_KEY}
      - CASTUO_TOKEN_GATEWAY_URL=${CASTUO_TOKEN_GATEWAY_URL}
      - CASTUO_TOKEN_API_KEY=${CASTUO_TOKEN_API_KEY}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID_B001=${TELEGRAM_CHAT_ID_B001}
      - GMAIL_USER=${GMAIL_USER}
      - GMAIL_PASSWORD=${GMAIL_PASSWORD}
      - WHATSAPP_BUSINESS_TOKEN=${WHATSAPP_BUSINESS_TOKEN}
      - WHATSAPP_BUSINESS_PHONE_ID=${WHATSAPP_BUSINESS_PHONE_ID}
      - NOTION_API_KEY=${NOTION_API_KEY}
      - NOTION_DATABASE_ID=${NOTION_DATABASE_ID}
      - OLLAMA_API_KEY=${OLLAMA_API_KEY:-}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-https://api.ollama.com/v1}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2:3b}
      - LANGSMITH_API_KEY=${LANGSMITH_API_KEY:-}
      - WATER_CTAEX_ENFORCE_QUOTA=${WATER_CTAEX_ENFORCE_QUOTA:-0}
      - WATER_API_KEY_TO_PLAN=${WATER_API_KEY_TO_PLAN:-}
      - CASTUO_SALES_EMAIL=${CASTUO_SALES_EMAIL:-}
      - WATER_USAGE_REPORT_KEY=${WATER_USAGE_REPORT_KEY:-}
      - WATER_BILLING_REGISTER_KEY=${WATER_BILLING_REGISTER_KEY:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL:-}
      - WATER_OVERDUE_MIN_DAYS=${WATER_OVERDUE_MIN_DAYS:-0}
      - AI_ACCOUNT_MANAGER_ENABLED=${AI_ACCOUNT_MANAGER_ENABLED:-0}
      - AI_FINANCIAL_ANALYST_ENABLED=${AI_FINANCIAL_ANALYST_ENABLED:-0}
      - AI_TECHNICAL_SUPPORT_ENABLED=${AI_TECHNICAL_SUPPORT_ENABLED:-0}
      - AI_INTEGRATION_KEY=${AI_INTEGRATION_KEY:-}
      - API_BASE_URL=${API_BASE_URL:-http://api:8000}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:8080}
    restart: unless-stopped

  mqtt:
    image: eclipse-mosquitto:2.0.15
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    restart: unless-stopped

  n8n:
    image: n8nio/n8n:1.0
    ports:
      - "5678:5678"
    volumes:
      - ./n8n:/home/node/.n8n
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD:-password}
      - GMAIL_USER=${GMAIL_USER}
      - GMAIL_PASSWORD=${GMAIL_PASSWORD}
      - WHATSAPP_BUSINESS_TOKEN=${WHATSAPP_BUSINESS_TOKEN}
      - WHATSAPP_BUSINESS_PHONE_ID=${WHATSAPP_BUSINESS_PHONE_ID}
      - NOTION_API_KEY=${NOTION_API_KEY}
      - OLLAMA_API_KEY=${OLLAMA_API_KEY:-}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-https://api.ollama.com/v1}
    restart: unless-stopped

  frontend:
    image: nginx:alpine
    ports:
      - "3000:80"
      - "443:443"
    volumes:
      - ./frontend/public:/usr/share/nginx/html:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    restart: unless-stopped

  certbot:
    image: certbot/certbot:latest
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h; done;'"
    restart: unless-stopped

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: castuo
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.13.2
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

volumes:
  mosquitto_data:
  mosquitto_log:
  postgres_data:
  qdrant_data:
