<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid IoT | CASTUO-SYSTEM</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #22c55e;
            --secondary: #16a34a;
            --dark: #064e3b;
            --light: #dcfce7;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            color: var(--dark);
        }
        .sidebar {
            background: linear-gradient(to bottom, var(--primary), var(--secondary));
            color: white;
        }
        .card {
            background: white;
            border-radius: 0.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1rem;
        }
        .sensor-card {
            background: white;
            border-radius: 0.5rem;
            padding: 1rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
    </style>
</head>
<body class="flex h-screen bg-gray-50">
    <!-- Sidebar -->
    <div class="sidebar w-64 space-y-6 py-7 px-2 fixed inset-y-0 left-0 transform -translate-x-0 transition duration-200 ease-in-out">
        <div class="text-center">
            <h1 class="text-2xl font-bold">🌿 CASTUO-SYSTEM</h1>
            <p class="text-sm">Cultivos sostenibles</p>
        </div>
        <nav class="space-y-3">
            <a href="index.html" class="flex items-center px-4 py-2 text-gray-100 hover:bg-green-700 rounded">
                <i class="fas fa-home mr-3"></i> Inicio
            </a>
            <a href="grid-iot.html" class="flex items-center px-4 py-2 bg-green-700 rounded text-white">
                <i class="fas fa-th-large mr-3"></i> Grid IoT
            </a>
        </nav>
    </div>

    <!-- Main Content -->
    <div class="ml-64 p-8 w-full">
        <h2 class="text-2xl font-bold mb-8">Grid IoT</h2>

        <!-- Grid de Sensores -->
        <div class="grid-container">
            <div class="sensor-card">
                <h3 class="font-bold">Sensor 1</h3>
                <p>Temperatura: 22°C</p>
                <p>Humedad: 65%</p>
                <p>Luz: 1200 lux</p>
                <div class="mt-2">
                    <span class="text-green-500">●</span> Online
                </div>
            </div>
            <div class="sensor-card">
                <h3 class="font-bold">Sensor 2</h3>
                <p>Temperatura: 21°C</p>
                <p>Humedad: 68%</p>
                <p>Luz: 1150 lux</p>
                <div class="mt-2">
                    <span class="text-green-500">●</span> Online
                </div>
            </div>
        </div>
    </div>
</body>
</html>
