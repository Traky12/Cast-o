<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Extremadura 4D Twin Visualizer (Scaffold)</title>
  <style>
    body { margin: 0; overflow: hidden; background: #0b0f14; font-family: Arial, sans-serif; }
    #info {
      position: absolute; top: 10px; left: 10px; color: #fff;
      background: rgba(0,0,0,0.55); padding: 12px; border-radius: 8px; max-width: 360px;
      font-size: 13px; line-height: 1.35;
      white-space: pre-wrap;
    }
    #status {
      color: #ffd39a;
      font-size: 12px;
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <div id="info">Loading digital twin...</div>
  <div id="status"></div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/controls/OrbitControls.js"></script>

  <script>
    function toColor(arr) {
      // arr in range 0..1
      const r = Math.max(0, Math.min(1, arr[0] || 0));
      const g = Math.max(0, Math.min(1, arr[1] || 0));
      const b = Math.max(0, Math.min(1, arr[2] || 0));
      return new THREE.Color(r, g, b);
    }

    const API_URL_DEFAULT = "http://localhost:8000/gemelos/export_3d";

    function getApiUrl() {
      const url = new URL(window.location.href);
      return url.searchParams.get("apiUrl") || API_URL_DEFAULT;
    }

    function sampleTwinData() {
      return {
        timestamp: new Date().toISOString(),
        geometry: {
          terracota_modules: { width: 0.8, height: 0.1, depth: 0.4, position: [0.0, 0.05, 0.0], color_scale: 0.5 },
          pv_panels: { width: 1.6, height: 0.02, depth: 1.0, position: [0.0, 2.5, 0.0], rotation: [0.0, 0.0, -15.0], color_scale: 0.7 },
          geotermia_pipes: { radius: 0.05, length: 2.0, position: [0.0, 0.0, -1.0] }
        },
        materials: {
          terracota: { base_color: [0.7, 0.6, 0.5], stress: 0.65 },
          pv_panels: { base_color: [0.2, 0.2, 0.8], metallic: 0.9 },
          geotermia_pipes: { base_color: [1.0, 0.3, 0.3], opacity: 0.7 }
        },
        thermal_data: { temp_exterior: 38, temp_interior: 23.5, cooling_source: "geotermia" },
        structural_data: { stress: 0.65, deformation: 0.006 },
        sensor_data: { pv_power: 3000, humidity: 30, wind_speed: 5 }
      };
    }

    async function loadTwinData() {
      const apiUrl = getApiUrl();
      try {
        const response = await fetch(apiUrl);
        if (!response.ok) throw new Error("HTTP " + response.status);
        const data = await response.json();
        return data;
      } catch (e) {
        document.getElementById("status").textContent = "Endpoint not available: " + e.message + " (using sample data).";
        return sampleTwinData();
      }
    }

    function buildScene(twinData) {
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(5, 6, 7);

      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);

      const controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.target.set(0.0, 1.2, 0.0);
      controls.update();

      const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
      scene.add(ambientLight);
      const directionalLight = new THREE.DirectionalLight(0xffffff, 0.9);
      directionalLight.position.set(2, 3, 2);
      scene.add(directionalLight);

      // Terracota module
      const tgeo = twinData.geometry.terracota_modules;
      const tmat = twinData.materials.terracota;
      const terracotaBox = new THREE.BoxGeometry(tgeo.width, tgeo.height, tgeo.depth);
      const terracotaMat = new THREE.MeshStandardMaterial({
        color: toColor(tmat.base_color),
        roughness: 0.8,
        metalness: 0.1
      });
      const terracotaMesh = new THREE.Mesh(terracotaBox, terracotaMat);
      terracotaMesh.position.set(tgeo.position[0], tgeo.position[1], tgeo.position[2]);
      scene.add(terracotaMesh);

      // PV panels
      const pv = twinData.geometry.pv_panels;
      const pvMat = twinData.materials.pv_panels;
      const pvBox = new THREE.BoxGeometry(pv.width, pv.height, pv.depth);
      const pvMesh = new THREE.MeshStandardMaterial({
        color: toColor(pvMat.base_color),
        roughness: 0.6,
        metalness: pvMat.metallic || 0.9
      });
      const pvPanelMesh = new THREE.Mesh(pvBox, pvMesh);
      pvPanelMesh.position.set(pv.position[0], pv.position[1], pv.position[2]);
      // rotation is degrees in scaffold
      pvPanelMesh.rotation.set(
        (pv.rotation[0] || 0) * Math.PI / 180.0,
        (pv.rotation[1] || 0) * Math.PI / 180.0,
        (pv.rotation[2] || 0) * Math.PI / 180.0
      );
      scene.add(pvPanelMesh);

      // Geotermia pipe
      const g = twinData.geometry.geotermia_pipes;
      const gMat = twinData.materials.geotermia_pipes;
      const pipeGeo = new THREE.CylinderGeometry(g.radius, g.radius, g.length, 24);
      const pipeMaterial = new THREE.MeshStandardMaterial({
        color: toColor(gMat.base_color),
        transparent: true,
        opacity: gMat.opacity || 0.7,
        roughness: 0.7,
        metalness: 0.2
      });
      const pipeMesh = new THREE.Mesh(pipeGeo, pipeMaterial);
      pipeMesh.position.set(g.position[0], g.position[1], g.position[2]);
      // Cylinder axis is Y by default; rotate to align with Z
      pipeMesh.rotation.x = Math.PI / 2;
      scene.add(pipeMesh);

      // Update info
      const thermal = twinData.thermal_data || {};
      const structural = twinData.structural_data || {};
      const sensor = twinData.sensor_data || {};
      const info = [
        "Extremadura 4D Twin (scaffold)",
        "Timestamp: " + (twinData.timestamp || "-"),
        "Temp exterior: " + (thermal.temp_exterior ?? "-") + " C",
        "Temp interior: " + (thermal.temp_interior ?? "-") + " C",
        "Cooling source: " + (thermal.cooling_source || "-"),
        "Stress terracota: " + (structural.stress ?? "-"),
        "PV power: " + (sensor.pv_power ?? "-") + " W",
      ].join("\n");
      document.getElementById("info").textContent = info;

      function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
      }
      animate();

      window.addEventListener("resize", function() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    }

    (async function main() {
      const twinData = await loadTwinData();
      buildScene(twinData);
    })();
  </script>
</body>
</html>
