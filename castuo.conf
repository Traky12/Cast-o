# Proxy reverso CASTÚO (contenedores api + n8n). Sustituye FQDN por CASTUO_DOMAIN / .env.production.
# Certbot webroot: /.well-known/acme-challenge/ → volumen castuo_certbot_www
# Panel Water/CTAEX (estático servido por el contenedor api): https://CASTUO_DOMAIN/water-admin/

upstream castuo_api {
    server api:8000;
    keepalive 32;
}

upstream castuo_n8n {
    server n8n:5678;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name castuo.tudominio.eu;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://castuo_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name n8n.castuo.tudominio.eu;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://castuo_n8n;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }
}

# TLS: certificados en volumen letsencrypt; bloques :443 generados por deploy/setup-ssl.sh
include /etc/nginx/conf.d/castuo-https.auto.conf;
