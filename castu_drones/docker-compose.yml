# CASTUO-SYSTEM™ — Stack Drones + MQTT + FastAPI (integrar con Odoo)
# Uso: desde raíz del repo: docker compose -f castu_drones/docker-compose.yml up -d
# Requiere backend y Odoo ya desplegados (docker-compose.yml + docker-compose.odoo-erp-legal.yml)

version: "3.9"

services:
  fastapi:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    image: castuo-backend:latest
    container_name: castuo-drones-api
    ports:
      - "8000:8000"
    volumes:
      - ../backend:/app
    environment:
      - PYTHONPATH=/app
      - ODOO_URL=${ODOO_URL:-http://odoo:8069}
      - ODOO_DB=${ODOO_DB:-castu-system}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Para MAVLink en host: expose /dev/ttyUSB* o usar network host
    restart: unless-stopped

  mqtt:
    image: eclipse-mosquitto:2.0.15
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    restart: unless-stopped

volumes:
  mosquitto_data:
  mosquitto_log:
