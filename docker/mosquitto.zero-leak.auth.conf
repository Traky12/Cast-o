# docker/mosquitto.zero-leak.auth.conf
# Mosquitto endurecido para Zero-Leak (MQTT autenticado).
#
# Importante:
# - allow_anonymous=false
# - password_file apunta a passwords.txt generado en un volumen (no en el repo).
#
listener 1883
allow_anonymous false
password_file /mosquitto/config/passwords.txt
persistence true
persistence_location /mosquitto/data/
log_dest file /mosquitto/log/mosquitto.log
log_type all

