# Laboratorio: solo 1883. Para TLS en 8883, añadir listener y certificados bajo /mosquitto/certs/
# y montar el volumen mosquitto_remote_certs (ver mosquitto.tls.conf.example).

listener 1883
allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
