# docker/mosquitto.zero-leak.conf
# Config MQTT para el stack Zero-Leak (arranque inmediato).
#
# Seguridad:
# - allow_anonymous = true para que el workflow v2 (que no trae user/pass en el JSON) funcione out-of-the-box.
# - Para producción endurecida, sustituir por docker/mosquitto.conf (allow_anonymous false) y crear docker/passwords.txt.
#
listener 1883
allow_anonymous true
persistence true
persistence_location /mosquitto/data/
log_dest file /mosquitto/log/mosquitto.log
log_type all

