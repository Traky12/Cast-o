# docker/docker-compose.ctaex.yml — CASTUO v6.0 CTAEX (monorepo: backend + production, compliance, ecommerce, blockchain)
# Ejecutar desde repo: docker compose -f docker/docker-compose.ctaex.yml up -d --build

version: '3.8'

services:
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    environment:
      - ENVIRONMENT=production
      - GAIA_CHAIN_RPC_URL=${GAIA_CHAIN_RPC_URL:-}
      - GAIA_API_KEY=${GAIA_API_KEY:-}
      - STRIPE_SECRET=${STRIPE_SECRET:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      # Opcional: leer secrets desde archivos (Docker Secrets)
      # - STRIPE_SECRET_FILE=/run/secrets/stripe_secret
      # - STRIPE_WEBHOOK_SECRET_FILE=/run/secrets/stripe_webhook_secret
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=castuo_ctaex
      - DB_USER=castuo_admin
      - DB_PASSWORD=${DB_PASSWORD:-ctaex_2026}
      - SHOPIFY_API_KEY=${SHOPIFY_API_KEY:-}
      - SHOPIFY_API_SECRET=${SHOPIFY_API_SECRET:-}
      - SHOPIFY_STORE_URL=${SHOPIFY_STORE_URL:-}
      - WOOCOMMERCE_API_KEY=${WOOCOMMERCE_API_KEY:-}
      - WOOCOMMERCE_API_SECRET=${WOOCOMMERCE_API_SECRET:-}
      - WOOCOMMERCE_STORE_URL=${WOOCOMMERCE_STORE_URL:-}
    depends_on:
      - postgres
    restart: unless-stopped
    # Desarrollo: descomentar para montar código local
    # volumes:
    #   - ../backend:/app/backend
    #   - ../blockchain:/app/blockchain
    #   - ../production:/app/production
    #   - ../compliance:/app/compliance
    #   - ../ecommerce:/app/ecommerce

  frontend:
    image: nginx:alpine
    ports:
      - "3000:80"
    volumes:
      - ../frontend/public:/usr/share/nginx/html:ro
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=castuo_ctaex
      - POSTGRES_USER=castuo_admin
      - POSTGRES_PASSWORD=${DB_PASSWORD:-ctaex_2026}
    volumes:
      - postgres_ctaex_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U castuo_admin"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  mqtt:
    image: eclipse-mosquitto:2.0
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto_ctaex_data:/mosquitto/data
      - mosquitto_ctaex_log:/mosquitto/log
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_ctaex_data:/var/lib/grafana
    restart: unless-stopped

volumes:
  postgres_ctaex_data:
  mosquitto_ctaex_data:
  mosquitto_ctaex_log:
  grafana_ctaex_data:
