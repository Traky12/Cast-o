# Nginx CTAEX con IP Whitelisting (producción)
# Copiar a /etc/nginx/sites-available/castuo-ctaex y enlazar en sites-enabled.
# Sustituir ctaex.castu.system por tu dominio y las IPs por las autorizadas (CTAEX, oficinas, socios).
#
# En nginx.conf (bloque http) añadir rate limiting para /api/:
#   limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

server {
    listen 80;
    server_name ctaex.castu.system;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ctaex.castu.system;

    ssl_certificate     /etc/letsencrypt/live/ctaex.castu.system/fullchain.pem;
    ssl_certificate_key  /etc/letsencrypt/live/ctaex.castu.system/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Headers de seguridad (CSP, X-Frame-Options, etc.)
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; img-src 'self' data:; font-src 'self' https://cdnjs.cloudflare.com; connect-src 'self'; frame-src 'self'; object-src 'none';";
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload";

    # IP Whitelisting para API (solo CTAEX, oficinas, socios). Rate limit: 10 req/s, burst 20.
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        allow 89.167.5.0/24;      # Red CTAEX
        allow 195.235.100.123;    # Oficina central
        allow 203.0.113.45;        # Socio comercial 1
        allow 203.0.113.46;       # Socio comercial 2
        allow 127.0.0.1;          # Localhost (Nginx/proxy)
        deny all;

        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /trazabilidad/ {
        allow 89.167.5.0/24;
        allow 195.235.100.123;
        allow 203.0.113.45;
        allow 203.0.113.46;
        allow 127.0.0.1;
        deny all;

        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /microgreens/ {
        allow 89.167.5.0/24;
        allow 195.235.100.123;
        allow 203.0.113.45;
        allow 203.0.113.46;
        allow 127.0.0.1;
        deny all;

        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /certificacion/ {
        allow 89.167.5.0/24;
        allow 195.235.100.123;
        allow 127.0.0.1;
        deny all;

        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ecommerce/ {
        allow 89.167.5.0/24;
        allow 195.235.100.123;
        allow 203.0.113.45;
        allow 203.0.113.46;
        allow 127.0.0.1;
        deny all;

        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /webhooks/ {
        # Webhooks (Stripe, etc.) suelen venir de IPs de proveedores; ajustar allow o no usar whitelist aquí
        allow 127.0.0.1;
        # allow 3.123.xxx.xxx;  # Stripe (consultar docs de Stripe para IPs)
        deny all;

        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /docs {
        allow 89.167.5.0/24;
        allow 195.235.100.123;
        allow 127.0.0.1;
        deny all;

        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Dashboard y raíz: solo CTAEX y oficina
    location / {
        allow 89.167.5.0/24;
        allow 195.235.100.123;
        allow 127.0.0.1;
        deny all;

        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Recursos estáticos públicos (certificados, etc.)
    location /static/ {
        allow all;
        alias /var/www/static/;
    }

    location /mqtt/ {
        allow 89.167.5.0/24;
        allow 195.235.100.123;
        allow 127.0.0.1;
        deny all;

        proxy_pass http://127.0.0.1:9001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
