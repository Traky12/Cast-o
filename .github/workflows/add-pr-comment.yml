name: Add PR Comment Summary

on:
  workflow_run:
    workflows:
      - Validate All
      - E2E - Pull Request to Main
    types: [completed]

permissions:
  checks: read
  pull-requests: write
  contents: read

jobs:
  add-comment:
    if: ${{ github.event.workflow_run.event == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: Post PR check summary comment
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const prs = run.pull_requests || [];
            if (!prs.length) {
              core.info('No associated pull request.');
              return;
            }
            const pr = prs[0];
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const checks = await github.rest.checks.listForRef({
              owner,
              repo,
              ref: run.head_sha,
              per_page: 100,
            });

            const checkRuns = checks.data.check_runs || [];
            const success = checkRuns.filter(c => c.conclusion === 'success').length;
            const failure = checkRuns.filter(c => c.conclusion === 'failure').length;
            const neutral = checkRuns.filter(c => c.conclusion === 'neutral' || c.conclusion === 'skipped').length;

            const details = checkRuns
              .slice(0, 20)
              .map(c => `- **${c.name}**: ${c.conclusion || 'in_progress'} (${c.html_url})`)
              .join('\n');

            const body = [
              `## 🔍 Resumen de checks del PR #${pr.number}`,
              '',
              `Workflow: **${run.name}**`,
              `Conclusión: **${run.conclusion || 'in_progress'}**`,
              `Run: ${run.html_url}`,
              '',
              `- ✅ Pasados: **${success}**`,
              `- ❌ Fallidos: **${failure}**`,
              `- ⏭️ Omitidos/Neutral: **${neutral}**`,
              '',
              '### Detalle de checks',
              details || '- Sin checks reportados todavía.'
            ].join('\n');

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: pr.number,
              body,
            });
