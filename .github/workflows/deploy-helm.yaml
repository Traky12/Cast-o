# Despliegue de CASTÚO-SYSTEM™ en Kubernetes con Helm
# Se ejecuta en push a main (ajustar branches si aplica)
name: Deploy to Kubernetes
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: "v3.13.0"

      - name: Configure kubectl (opcional)
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
        if: ${{ secrets.KUBE_CONFIG != '' }}

      - name: Helm dependency update
        run: |
          helm dependency update kubernetes/helm/castuo-system

      - name: Helm upgrade (install)
        run: |
          helm upgrade --install castuo-system kubernetes/helm/castuo-system \
            --namespace castuo \
            --create-namespace \
            --set domain=castuo-system.eu \
            --set agents.image.tag=${{ github.sha }} \
            --wait
        if: ${{ secrets.KUBE_CONFIG != '' }}
