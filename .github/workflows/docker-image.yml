name: Python validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            api/requirements.txt
            castuo_graph/requirements.txt
            services/iot/requirements.txt
            services/satellite/requirements.txt

      - name: Install dependencies from available manifests
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          for req in api/requirements.txt castuo_graph/requirements.txt services/iot/requirements.txt services/satellite/requirements.txt; do
            if [[ -f "$req" ]]; then
              python -m pip install -r "$req"
            fi
          done
          python -m pip install flake8 pytest pytest-asyncio jsonschema httpx

      - name: Lint with flake8
        shell: bash
        run: |
          set -euo pipefail
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --extend-exclude=test_e2e.py
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics --extend-exclude=test_e2e.py

      - name: Test with pytest
        shell: bash
        run: |
          set -euo pipefail
          if find . -maxdepth 3 -type f \( -name 'test_*.py' -o -name '*_test.py' \) -print -quit | grep -q .; then
            python -m pytest -q
          else
            echo "No Python tests found; validation remains lint-only."
          fi
