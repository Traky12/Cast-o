name: Python validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            api/requirements.txt
            castuo_graph/requirements.txt
            services/iot/requirements.txt
            services/satellite/requirements.txt

      - name: Install dependencies from available manifests
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          for req in api/requirements.txt castuo_graph/requirements.txt services/iot/requirements.txt services/satellite/requirements.txt; do
            if [[ -f "$req" ]]; then
              python -m pip install -r "$req"
            fi
          done
          python -m pip install flake8 'pytest<9' 'pytest-cov<7'

      - name: Lint with flake8
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t PYTHON_SOURCES < <(find api castuo_graph services scripts -type f -name '*.py' -print 2>/dev/null | sort)
          if ((${#PYTHON_SOURCES[@]} == 0)); then
            echo "No Python sources found; lint skipped."
            exit 0
          fi
          flake8 "${PYTHON_SOURCES[@]}" --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 "${PYTHON_SOURCES[@]}" --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Test with pytest
        shell: bash
        run: |
          set -euo pipefail
          if find . -maxdepth 3 -type f \( -name 'test_*.py' -o -name '*_test.py' \) -print -quit | grep -q .; then
            python -m pytest -q
          else
            echo "No Python tests found; validation remains lint-only."
          fi
