name: GitHub Operativity Certification (TRL9)

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "tests/test_github_integration_toggle.py"
      - "test_github_integration_toggle.py"
      - "scripts/setup-prod-hardening.sh"
      - "Makefile"
      - "pytest.ini"
      - "tests/test_secure_defaults.py"
      - "tests/test_env_production_template.py"
      - ".env.production.example"
      - ".github/workflows/github-operativity-certification.yml"
  pull_request:
    branches: [main]
    paths:
      - "api/**"
      - "tests/test_github_integration_toggle.py"
      - "test_github_integration_toggle.py"
      - "scripts/setup-prod-hardening.sh"
      - "Makefile"
      - "pytest.ini"
      - "tests/test_secure_defaults.py"
      - "tests/test_env_production_template.py"
      - ".env.production.example"
      - ".github/workflows/github-operativity-certification.yml"
  workflow_dispatch:

concurrency:
  group: github-operativity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  certify-operativity:
    name: Certify Operativity TRL9 ON/OFF
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            api/requirements.txt
            requirements/dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt
          pip install -r requirements/dev.txt

      - name: Run operativity certification suite
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          make test-github-operativity

      - name: Run certification marker tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          make test-github-certification

      - name: Validate secure defaults in production
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest -q tests/test_secure_defaults.py

      - name: Validate production env template secure defaults
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest -q tests/test_env_production_template.py

      - name: Validate decoupled hardening mode (no GitHub required)
        run: |
          REQUIRE_GITHUB_HARDENING=0 bash scripts/setup-prod-hardening.sh

      - name: Generate operativity evidence artifact
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          make test-github-evidence

      - name: Upload operativity evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: github-operativity-evidence
          path: artifacts/operativity/github-operativity-latest.txt
          retention-days: 30

      - name: Summary
        if: always()
        run: |
          echo "### GitHub Operativity Certification (TRL9)" >> "$GITHUB_STEP_SUMMARY"
          echo "- test-github-operativity: executed" >> "$GITHUB_STEP_SUMMARY"
          echo "- test-github-certification: executed" >> "$GITHUB_STEP_SUMMARY"
          echo "- secure defaults production test: executed" >> "$GITHUB_STEP_SUMMARY"
          echo "- production env template secure defaults test: executed" >> "$GITHUB_STEP_SUMMARY"
          echo "- decoupled hardening mode: validated" >> "$GITHUB_STEP_SUMMARY"
          echo "- test-github-evidence artifact: uploaded" >> "$GITHUB_STEP_SUMMARY"
