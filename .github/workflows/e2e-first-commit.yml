name: E2E - Main Bootstrap Docs

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'config/**'
      - 'infrastructure/**'
      - 'scripts/**'
      - 'docker-compose*.yml'
      - '.github/workflows/e2e-first-commit.yml'
  workflow_dispatch:

permissions:
  contents: write
  security-events: write

concurrency:
  group: e2e-first-commit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-docs:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up shell permissions
        run: chmod +x scripts/validate-first-commit.sh scripts/generate-quick-reference.sh scripts/notify-slack.sh

      - name: Detect bootstrap-worthy main push
        id: bootstrap
        run: ./scripts/validate-first-commit.sh main

      - name: Generate QUICK-REFERENCE.md
        if: ${{ steps.bootstrap.outputs.should_run == 'true' }}
        run: ./scripts/generate-quick-reference.sh

      - name: Commit generated documentation
        if: ${{ steps.bootstrap.outputs.should_run == 'true' }}
        run: |
          if git diff --quiet -- docs/QUICK-REFERENCE.md; then
            echo "No doc changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/QUICK-REFERENCE.md
          git commit -m "docs: actualizar quick reference automatizado"
          git push

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.20.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif

      - name: Upload Trivy SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

      - name: Upload generated docs artifact
        if: ${{ steps.bootstrap.outputs.should_run == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: quick-reference-main-bootstrap
          path: docs/QUICK-REFERENCE.md
          retention-days: 30

      - name: Notify Slack
        if: ${{ always() && steps.bootstrap.outputs.should_run == 'true' }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          ./scripts/notify-slack.sh "🎉 Main bootstrap validado\n\n📝 QUICK-REFERENCE.md actualizado\n🔒 Trivy ejecutado\n📌 Motivo: ${{ steps.bootstrap.outputs.reason }}"
