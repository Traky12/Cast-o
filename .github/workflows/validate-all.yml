name: Validate All
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: validate-all-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  validate-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Validate documentation
        run: |
          chmod +x scripts/validate-docs.sh
          ./scripts/validate-docs.sh

  validate-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            api/requirements.txt

      - name: Validate package and run JS tests
        run: |
          npm ci
          npm run validate:package
          npm run test:js

      - name: Install Python dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r api/requirements.txt -r requirements/dev.txt

      - name: Run Python test suite with coverage
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          mkdir -p artifacts
          python -m pytest tests/ -v \
            --cov=api \
            --cov=services \
            --cov=castuo_graph \
            --cov-report=term-missing \
            --cov-report=xml:artifacts/coverage.xml

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: coverage-report
          path: artifacts/coverage.xml

      - name: Validate local cloud contract
        shell: bash
        run: |
          set -euo pipefail
          cp .env.cloud.example .env.cloud
          python -m compileall -q api services castuo_graph
          echo "Local contract validation passed; external cloud readiness remains a separate evidence gate."

  validate-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
      - name: Upload Trivy SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3.38.2
        with:
          sarif_file: trivy-results.sarif

  notify-failure:
    if: ${{ always() && (needs.validate-docs.result != 'success' || needs.validate-tests.result != 'success' || needs.validate-security.result != 'success') }}
    runs-on: ubuntu-latest
    needs: [validate-docs, validate-tests, validate-security]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Notify Slack on failure only
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          if [[ -z "${SLACK_WEBHOOK_URL:-}" ]]; then
            echo "SLACK_WEBHOOK_URL missing; notification skipped."
            exit 0
          fi
          chmod +x scripts/notify-slack.sh
          ./scripts/notify-slack.sh "Workflow Validate All con fallos\nDocs: ${{ needs.validate-docs.result }}\nTests: ${{ needs.validate-tests.result }}\nSecurity: ${{ needs.validate-security.result }}\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
