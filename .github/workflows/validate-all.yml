name: Validate All
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: validate-all-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  validate-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate documentation
        run: |
          chmod +x scripts/validate-docs.sh
          ./scripts/validate-docs.sh

  validate-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            api/requirements.txt

      - name: Validate package and run JS tests
        run: |
          npm ci
          npm run validate:package
          npm run test:js

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt
          pip install -r requirements/dev.txt

      - name: Run Python test suite with coverage
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          mkdir -p artifacts
          python -m pytest tests/ -v \
            --cov=api \
            --cov=services \
            --cov=castuo_graph \
            --cov-report=term-missing \
            --cov-report=xml:artifacts/coverage.xml

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: artifacts/coverage.xml

      - name: Validate cloud gate
        run: |
          cp .env.cloud.example .env.cloud
          mkdir -p secrets
          for f in vault_token iot_bearer wireless_logic_token mistral_key sabionda_key; do echo dummy > "secrets/$f"; done
          make validate ENV_FILE=.env.cloud PROFILES="core iot ai observability"

  validate-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.20.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
      - name: Upload Trivy SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

  notify-failure:
    if: ${{ always() && (needs.validate-docs.result != 'success' || needs.validate-tests.result != 'success' || needs.validate-security.result != 'success') }}
    runs-on: ubuntu-latest
    needs: [validate-docs, validate-tests, validate-security]
    steps:
      - uses: actions/checkout@v4
      - name: Notify Slack on failure only
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          chmod +x scripts/notify-slack.sh
          ./scripts/notify-slack.sh "🚨 Validate All con fallos\n\nDocs: ${{ needs.validate-docs.result }}\nTests: ${{ needs.validate-tests.result }}\nSecurity: ${{ needs.validate-security.result }}\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
