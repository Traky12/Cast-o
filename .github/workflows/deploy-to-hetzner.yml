name: Deploy to Hetzner (Kubernetes)

on:
  workflow_dispatch:
  push:
    branches: ["main", "feat/excelencia-operativa"]
    paths:
      - "api/**"
      - "k8s/**"
      - ".github/workflows/deploy-to-hetzner.yml"

concurrency:
  group: deploy-hetzner-k8s
  cancel-in-progress: true

jobs:
  test-api:
    name: Tests API
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt
          pip install pytest

      - name: Run API tests
        run: python -m pytest tests/test_api.py -v

  build-push:
    name: Build & Push image
    runs-on: ubuntu-latest
    needs: test-api
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: registry.castuo-system.cloud/castuo-api
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest

      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: registry.castuo-system.cloud
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./api
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    name: Deploy k8s Hetzner
    runs-on: ubuntu-latest
    needs: build-push
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.HETZNER_KUBECONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Apply namespace and config
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/configmap.yaml

      - name: Apply secrets desde GitHub Secrets
        run: |
          kubectl create secret generic castuo-secrets \
            --namespace castuo-system \
            --from-literal=JWT_SECRET_KEY="${{ secrets.JWT_SECRET_KEY }}" \
            --from-literal=GAIACHAIN_PRIVATE_KEY="${{ secrets.GAIACHAIN_PRIVATE_KEY }}" \
            --from-literal=DB_PASSWORD="${{ secrets.DB_PASSWORD }}" \
            --save-config \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply storage and networking
        run: |
          kubectl apply -f k8s/pvc.yaml
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/ingress.yaml
          kubectl apply -f k8s/hpa.yaml

      - name: Apply deployment base
        run: |
          kubectl apply -f k8s/deployment.yaml

      - name: Update image tag and deploy
        run: |
          IMAGE_TAG="${{ needs.build-push.outputs.image_tag }}"
          kubectl set image deployment/castuo-api \
            castuo-api=registry.castuo-system.cloud/castuo-api:${IMAGE_TAG} \
            -n castuo-system
          kubectl annotate deployment/castuo-api \
            castuo-system/image-tag="${IMAGE_TAG}" \
            -n castuo-system --overwrite
          kubectl rollout status deployment/castuo-api -n castuo-system --timeout=180s

      - name: Healthcheck post-deploy
        run: |
          sleep 10
          curl -fsS https://api.castuo-system.cloud/health > /dev/null
          echo "Deploy OK — API respondiendo en producción"

      - name: Resumen del despliegue
        if: always()
        run: |
          echo "=== Estado del despliegue ==="
          kubectl get pods -n castuo-system
          kubectl get hpa -n castuo-system
          kubectl get ingress -n castuo-system
