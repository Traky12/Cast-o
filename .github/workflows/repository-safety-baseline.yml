name: Repository Safety Baseline

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Reject tracked environment files
        shell: bash
        run: |
          set -euo pipefail
          forbidden=0
          while IFS= read -r -d '' f; do
            case "$f" in
              .env|.env.*|*.env|*.tfvars|*.tfvars.json)
                case "$f" in
                  *.example|*.sample) ;;
                  *) echo "Forbidden tracked environment/variable file: $f"; forbidden=1;;
                esac
                ;;
            esac
          done < <(git ls-files -z)
          if [ "$forbidden" -ne 0 ]; then
            exit 1
          fi

      - name: Scan for obvious credential assignments
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(
            git ls-files -z |
              grep -zEv '(^|/)(.env([^/]*|$)|.*.example)$|^docs/|^scripts/|^tests/|^.github/workflows/repository-safety-baseline.yml$'
          )
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No eligible files to scan."
            exit 0
          fi

          pattern='(THINGS_DATA|THINGSDATA|API_KEY|API_SECRET|ACCESS_TOKEN|PASSWORD|PRIVATE_KEY)[[:space:]]*[:=][[:space:]]*("[^"$<>]{12,}"|'\''[^'\''"$<>]{12,}'\''|[A-Za-z0-9._:+/@-]{16,})'
          matches="$(grep -nIHE -- "$pattern" "${files[@]}" || true)"
          matches="$(printf "%s\n" "$matches" | grep -vEi "(YOUR_|CHANGE_?ME|PLACEHOLDER|REDACTED|DUMMY|EXAMPLE|REPLACE|^.*=[[:space:]]*CASTUO_[A-Z0-9_]+$|^.*=[[:space:]]*CI_[A-Z0-9_]+$)" || true)"
          if [ -n "$matches" ]; then
            printf "%s\n" "$matches"
            echo "Potential credential assignment detected. Review before merge."
            exit 1
          fi
      - name: Report repository status
        shell: bash
        run: |
          echo "Safety baseline completed."
