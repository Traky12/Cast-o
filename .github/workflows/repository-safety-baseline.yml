name: Repository Safety Baseline

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Reject tracked environment files
        shell: bash
        run: |
          set -euo pipefail
          forbidden=0
          while IFS= read -r -d '' file; do
            case "$file" in
              .env|.env.*|*.env|*.tfvars|*.tfvars.json)
                case "$file" in
                  *.example|*.sample) ;;
                  *) printf 'Forbidden tracked environment/variable file: %s\n' "$file"; forbidden=1 ;;
                esac
                ;;
            esac
          done < <(git ls-files -z)
          if [ "$forbidden" -ne 0 ]; then
            exit 1
          fi

      - name: Scan tracked source and configuration for hard-coded credentials
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          import subprocess
          import sys
          from pathlib import Path

          # Detect literal values assigned to common credential names.
          # Uppercase environment/config names accept quoted and bare literals.
          uppercase = re.compile(
              r'\b(?:THINGS_DATA|THINGSDATA|API_KEY|API_SECRET|ACCESS_TOKEN|PASSWORD|PRIVATE_KEY)\b'
              r'\s*[:=]\s*(?P<literal>"[^"\n]{20,}"|\x27[^\x27\n]{20,}\x27|[A-Za-z0-9._:+/@-]{24,})'
          )
          # Lowercase identifiers are common local variable/type names; only
          # quoted literals are considered to avoid flagging function calls/types.
          lowercase = re.compile(
              r'\b(?:password|private_key|api_key|api_secret|access_token|thingsdata)\b'
              r'\s*[:=]\s*(?P<literal>"[^"\n]{20,}"|\x27[^\x27\n]{20,}\x27)',
              re.IGNORECASE,
          )
          ignored = re.compile(
              r'(YOUR_|CHANGE_?ME|PLACEHOLDER|REDACTED|DUMMY|EXAMPLE|REPLACE|'
              r'^\$|^os\.|^getenv|^load_|^derive_|^secretstr|^settings\.|'
              r'^castuo_|^ci_|^test_|^fake_|^(none|null)$)',
              re.IGNORECASE,
          )
          excluded_parts = {"docs", "artifacts", "tests", "fixtures", "examples"}
          excluded_suffixes = (".example", ".sample")
          workflow_path = ".github/workflows/repository-safety-baseline.yml"
          findings = []

          paths = subprocess.run(
              ["git", "ls-files", "-z"], check=True, capture_output=True
          ).stdout.split(b"\0")
          for raw_path in paths:
              if not raw_path:
                  continue
              path = raw_path.decode("utf-8", errors="surrogateescape")
              if excluded_parts.intersection(Path(path).parts):
                  continue
              if path == workflow_path or path.endswith(excluded_suffixes):
                  continue
              try:
                  source = Path(path).read_text(encoding="utf-8")
              except (OSError, UnicodeError):
                  continue
              for line_number, line in enumerate(source.splitlines(), 1):
                  for rule in (uppercase, lowercase):
                      for match in rule.finditer(line):
                          raw_value = match.group("literal")
                          token = raw_value[1:-1] if raw_value[:1] in {"'", '"'} else raw_value
                          if ignored.search(token):
                              continue
                          name = re.search(
                              r'\b(?:THINGS_DATA|THINGSDATA|API_KEY|API_SECRET|ACCESS_TOKEN|PASSWORD|PRIVATE_KEY|'
                              r'password|private_key|api_key|api_secret|access_token|thingsdata)\b',
                              match.group(0),
                              re.IGNORECASE,
                          )
                          findings.append(f"{path}:{line_number}: {name.group(0) if name else 'credential'}")

          if findings:
              print("Potential hard-coded credential literals found (values suppressed):")
              for finding in sorted(set(findings)):
                  print(f"  {finding}")
              sys.exit(1)

          print("No obvious hard-coded credential literals found.")
          PY

      - name: Report repository status
        shell: bash
        run: echo "Repository safety baseline completed."
