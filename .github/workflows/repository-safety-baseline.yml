name: Repository Safety Baseline

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Reject tracked environment files
        shell: bash
        run: |
          set -euo pipefail
          forbidden=0
          while IFS= read -r -d '' file; do
            case "$file" in
              .env|.env.*|*.env|*.tfvars|*.tfvars.json)
                case "$file" in
                  *.example|*.sample) ;;
                  *) printf 'Forbidden tracked environment/variable file: %s\n' "$file"; forbidden=1 ;;
                esac
                ;;
            esac
          done < <(git ls-files -z)
          if [ "$forbidden" -ne 0 ]; then
            exit 1
          fi

      - name: Scan tracked text for obvious credential assignments
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          import subprocess
          import sys
          from pathlib import Path

          names = r"(?:THINGS_DATA|THINGSDATA|API_KEY|API_SECRET|ACCESS_TOKEN|PASSWORD|PRIVATE_KEY)"
          value = r"""(?P<quoted>"[^"\n]{12,}"|'[^'\n]{12,}')|(?P<bare>[A-Za-z0-9._:+/@-]{16,})"""
          assignment = re.compile(r"\b" + names + r"\b\s*[:=]\s*(?:" + value + r")", re.IGNORECASE)
          ignored = re.compile(
              r"(YOUR_|CHANGE_?ME|PLACEHOLDER|REDACTED|DUMMY|EXAMPLE|REPLACE|"
              r"^\$|^os\.environ|^environ\.get|^settings\.|^castuo_[a-z0-9_]+$|"
              r"^ci_[a-z0-9_]+$|^test_|^fake_|^(none|null)$)",
              re.IGNORECASE,
          )
          excluded_parts = {"docs", "artifacts"}
          excluded_suffixes = (".example", ".sample")
          findings = []

          paths = subprocess.run(
              ["git", "ls-files", "-z"], check=True, capture_output=True
          ).stdout.split(b"\0")
          for raw_path in paths:
              if not raw_path:
                  continue
              path = raw_path.decode("utf-8", errors="surrogateescape")
              parts = Path(path).parts
              if excluded_parts.intersection(parts):
                  continue
              if path == ".github/workflows/repository-safety-baseline.yml":
                  continue
              if path.endswith(excluded_suffixes):
                  continue
              try:
                  data = Path(path).read_text(encoding="utf-8")
              except (OSError, UnicodeError):
                  continue
              for line_number, line in enumerate(data.splitlines(), 1):
                  for match in assignment.finditer(line):
                      raw_value = match.group("quoted") or match.group("bare") or ""
                      token = raw_value[1:-1] if raw_value[:1] in {"'", '"'} else raw_value
                      if ignored.search(token):
                          continue
                      # Do not print the candidate value; only identify its location.
                      findings.append(f"{path}:{line_number}: {match.group(0).split('=')[0].split(':')[0].strip()}")

          if findings:
              print("Potential credential assignments detected (values suppressed):")
              for finding in findings:
                  print(f"  {finding}")
              sys.exit(1)

          print("No obvious hard-coded credential assignments found.")
          PY

      - name: Report repository status
        shell: bash
        run: echo "Repository safety baseline completed."
