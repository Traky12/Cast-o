name: CI JS
on:
  push:
    branches: [ main, staging ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Manual trigger

jobs:
  test-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'  # ⭐ Cache 80% más rápido
      
      - name: Install deps
        run: npm ci  # ⭐ Más rápido y reproducible que npm install
      
      - name: Run JS tests
        run: npm test --runInBand  # ⭐ Evita OOM en GitHub runners
      
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: js-coverage
          path: coverage/
