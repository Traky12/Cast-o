name: Deploy Hetzner Staging

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "api/**"
      - "docker-compose.yml"
      - ".github/workflows/deploy-hetzner-staging.yml"

concurrency:
  group: deploy-hetzner-staging
  cancel-in-progress: true

jobs:
  test-api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt
          pip install pytest

      - name: Run API tests
        run: python -m pytest tests/test_api.py -v

  deploy-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: test-api
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy with SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HETZNER_STAGING_HOST }}
          username: ${{ secrets.HETZNER_STAGING_USER }}
          key: ${{ secrets.HETZNER_STAGING_SSH_KEY }}
          port: ${{ secrets.HETZNER_STAGING_PORT || '22' }}
          script_stop: true
          script: |
            set -euo pipefail
            APP_DIR="${{ secrets.HETZNER_STAGING_APP_DIR }}"
            REPO_URL="https://github.com/${{ github.repository }}.git"

            if [ -z "$APP_DIR" ]; then
              echo "HETZNER_STAGING_APP_DIR no configurado"
              exit 1
            fi

            if [ ! -d "$APP_DIR/.git" ]; then
              mkdir -p "$APP_DIR"
              git clone "$REPO_URL" "$APP_DIR"
            fi

            cd "$APP_DIR"
            git fetch --all --prune
            git checkout main
            git reset --hard origin/main

            if [ -f ".env.staging" ] && [ ! -f ".env" ]; then
              cp .env.staging .env
            fi

            docker compose pull || true
            docker compose up -d --build
            docker compose ps

      - name: Staging healthcheck
        run: |
          set -euo pipefail
          curl -fsS "${{ secrets.STAGING_HEALTHCHECK_URL }}" > /dev/null
          echo "Deploy staging OK"
