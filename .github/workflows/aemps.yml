# SABIONDA v7.1 | Certificación AEMPS (Cursor/GitHub Actions)
# Valida THC con LIMS/API, registra en GaiaChain. Barreras v7.1.

name: AEMPS Certification

on:
  workflow_dispatch:
    inputs:
      batch_id:
        description: 'Batch ID to certify'
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - 'backend/routers/cannabis.py'
      - 'backend/services/gaia_chain.py'

jobs:
  validate-thc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check THC (script or API)
        env:
          BATCH_ID: ${{ github.event.inputs.batch_id || 'demo-batch' }}
          LIMS_API_URL: ${{ secrets.LIMS_API_URL || 'https://lims.ctaex.es/api/v1' }}
        run: |
          echo "Validating batch $BATCH_ID for THC <= 0.3% (RD 903/2025)"
          python scripts/validate_lims.py "$BATCH_ID" || true
          echo "THC check step completed (configure LIMS_API_URL for real validation)"

      - name: Register in GaiaChain
        env:
          BATCH_ID: ${{ github.event.inputs.batch_id || 'demo-batch' }}
        run: |
          python scripts/register_gaiachain.py "$BATCH_ID" || true
          echo "GaiaChain registration step completed (configure GAIA_CHAIN_* for real chain)"
