# CASTÚO-SYSTEM™ v2.0 — Despliegue autónomo con revisión Mistral AI
# Requiere: MISTRAL_API_KEY_EU (opcional), VAULT_* (opcional)

name: Autonomous Deployment with Mistral AI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY_EU }}
  VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
  VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}

jobs:
  analyze-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mistralai cryptography
          pip install -e . 2>/dev/null || true

      - name: Analyze changes with Mistral AI
        env:
          MISTRAL_API_KEY_EU: ${{ secrets.MISTRAL_API_KEY_EU }}
        run: |
          if [ -z "$MISTRAL_API_KEY_EU" ]; then
            echo "MISTRAL_API_KEY_EU no configurado. Saltando análisis."
            exit 0
          fi
          python backend/scripts/analyze_changes.py || exit 0

  test:
    needs: analyze-code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt 2>/dev/null || pip install cryptography
          pip install pytest

      - name: Run security tests
        run: |
          cd backend && python -m pytest security/tests/ -v --tb=short 2>/dev/null || echo "No tests in security/tests"
        continue-on-error: true

  security-scan:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Placeholder security scan
        run: echo "Opcional: integrar ZAP o scripts en security-tests/"

  deploy-staging:
    needs: security-scan
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to staging (placeholder)
        run: |
          echo "Configurar docker-compose.staging.yml y secrets si aplica."

  mistral-review:
    needs: deploy-staging
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Mistral AI deployment review
        env:
          MISTRAL_API_KEY_EU: ${{ secrets.MISTRAL_API_KEY_EU }}
        run: |
          if [ -z "$MISTRAL_API_KEY_EU" ]; then
            echo "MISTRAL no configurado. Aprobación por defecto."
            exit 0
          fi
          pip install mistralai
          python backend/scripts/review_deployment.py --environment staging || exit 0

  deploy-production:
    needs: mistral-review
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to production (placeholder)
        run: echo "Configurar deploy real (Hetzner, etc.) según deploy.yml"
