name: Deploy Castúo-System — Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/castuo-api

jobs:
  # ── 1. Tests completos ────────────────────────────────────────────────────
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install system deps (cffi)
        run: sudo apt-get install -y python3-cffi libffi-dev

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r api/requirements.txt
          pip install pytest pytest-cov pytest-asyncio

      - name: Run full test suite
        run: |
          pytest tests/ \
            --cov=api \
            --cov=castuo_graph \
            --cov-report=xml \
            --cov-report=term-missing \
            -v
        env:
          CASTUO_ROBOTICS_LAB_CHAIN_REGISTER: "0"
          QR_REGISTRY_PATH: /tmp/castuo_qr_registry_ci.json

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        continue-on-error: true
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml

  # ── 2. Lint de seguridad ──────────────────────────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install bandit + safety
        run: pip install bandit safety

      - name: Bandit SAST scan
        run: |
          bandit -r api/ castuo_graph/ backend/ services/ \
            -ll \
            --exclude api/routers/__pycache__,castuo_graph/__pycache__ \
            -f txt

      - name: Safety dependency audit
        run: safety check -r api/requirements.txt || true

  # ── 3. Build imagen Docker ────────────────────────────────────────────────
  build:
    name: Build & Push Docker image
    runs-on: ubuntu-latest
    needs: [test, security]
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./api
          file: ./api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 4. Deploy a Hetzner (SSH) ─────────────────────────────────────────────
  deploy:
    name: Deploy to Hetzner Production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HETZNER_IP }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          port: ${{ secrets.HETZNER_SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -euo pipefail
            APP_DIR=/opt/castuo-system

            cd "$APP_DIR"
            git fetch origin main
            git reset --hard origin/main

            # Rotar secretos desde Vault si está disponible
            if command -v vault &>/dev/null && vault status &>/dev/null; then
              vault kv get -field=jwt_secret secret/castuo/api > /run/secrets/jwt_secret 2>/dev/null || true
              vault kv get -field=gaiachain_key secret/castuo/blockchain > /run/secrets/gaiachain_key 2>/dev/null || true
            fi

            docker compose pull
            docker compose up -d --build --remove-orphans
            docker compose ps

      - name: Production healthcheck
        run: |
          sleep 10
          curl -fsS "https://api.castuo-system.cloud/health" | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          assert d['status']=='ok', f'status={d[\"status\"]}'
          print(f'API healthy — chain_status={d.get(\"chain_status\",\"?\")}')
          "

  # ── 5. Deploy Kubernetes (Hetzner k8s opcional) ───────────────────────────
  deploy-k8s:
    name: Deploy to Kubernetes (optional)
    runs-on: ubuntu-latest
    needs: build
    if: >
      github.ref == 'refs/heads/main' &&
      secrets.KUBE_CONFIG != ''
    environment: production-k8s
    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Update image tag in manifests
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}"
          sed -i "s|image: .*castuo-api.*|image: $IMAGE|g" k8s/deployment.yaml

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f k8s/configmap.yaml  -n castuo-system
          kubectl apply -f k8s/deployment.yaml -n castuo-system
          kubectl apply -f k8s/service.yaml    -n castuo-system
          kubectl apply -f k8s/ingress.yaml    -n castuo-system
          kubectl rollout status deployment/castuo-api -n castuo-system --timeout=120s

      - name: Verify pods
        run: kubectl get pods -n castuo-system -l app=castuo-api
