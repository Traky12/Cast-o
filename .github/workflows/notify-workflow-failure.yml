name: Notify Workflow Failure

on:
  workflow_run:
    workflows:
      - Validate All
      - E2E First Sale Digital
      - Validate Thingsdata IoT Integration
      - E2E Smoke — TRACES API
      - E2E - Pull Request to Main
      - E2E - Merge to Main
      - E2E - Release
    types: [completed]

permissions:
  pull-requests: write
  contents: read

jobs:
  notify-failure:
    if: ${{ github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'timed_out' || github.event.workflow_run.conclusion == 'cancelled' }}
    runs-on: ubuntu-latest
    steps:
      - name: Notify Slack only on failure
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
            echo "SLACK_WEBHOOK_URL missing; skip"
            exit 0
          fi
          payload=$(cat <<EOF
          {
            "text": "🚨 Workflow fallido: ${{ github.event.workflow_run.name }}\nConclusión: ${{ github.event.workflow_run.conclusion }}\nBranch: ${{ github.event.workflow_run.head_branch }}\nRun: ${{ github.event.workflow_run.html_url }}"
          }
          EOF
          )
          curl -sS -X POST -H "Content-Type: application/json" --data "$payload" "$SLACK_WEBHOOK_URL" > /dev/null

      - name: Comment on PR when available
        if: ${{ github.event.workflow_run.event == 'pull_request' }}
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const prs = run.pull_requests || [];
            if (!prs.length) {
              core.info('No PR associated');
              return;
            }
            const pr = prs[0];
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body: `🚨 **Fallo en workflow**\n\n- Workflow: ${run.name}\n- Conclusión: ${run.conclusion}\n- Run: ${run.html_url}`,
            });
