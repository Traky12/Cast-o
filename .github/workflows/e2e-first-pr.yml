name: E2E - Pull Request to Main

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

# Read-only: the changelog preview is published as an artifact and in the job
# summary. The workflow never commits or pushes to PR branches.
permissions:
  contents: read

concurrency:
  group: e2e-first-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Fix script permissions
        run: chmod +x scripts/generate-changelog.sh scripts/notify-slack.sh

      - name: Validate package.json
        run: npm run validate:package

      - name: Install and run JS tests
        run: |
          npm install
          npm run test:js

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt
          pip install pytest jsonschema httpx

      - name: Run API tests
        run: python -m pytest tests/test_api.py -v

      - name: Prepare cloud validation fixtures
        run: |
          cp .env.cloud.example .env.cloud
          mkdir -p secrets
          for f in vault_token iot_bearer wireless_logic_token mistral_key sabionda_key; do echo dummy > "secrets/$f"; done

      - name: Validate cloud gate
        run: make validate ENV_FILE=.env.cloud PROFILES="core iot ai observability"

      - name: Generate changelog preview
        run: ./scripts/generate-changelog.sh CHANGELOG.md

      - name: Upload changelog artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: changelog-pr-${{ github.event.pull_request.number }}
          path: CHANGELOG.md
          retention-days: 30

      - name: Publish changelog preview (read-only)
        run: |
          {
            echo "## Changelog preview (not committed)"
            echo
            echo "Generated from this PR; download the \`changelog-pr-${{ github.event.pull_request.number }}\` artifact for the full file."
            echo "Updating CHANGELOG.md in the repository is a human decision at merge/release time."
            echo
            echo '```diff'
            git diff -- CHANGELOG.md | head -n 80
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Notify Slack
        if: ${{ failure() }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          ./scripts/notify-slack.sh "🚨 Fallo en E2E PR\n\n🔗 PR: ${{ github.event.pull_request.html_url }}\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
