name: E2E - Pull Request to Main

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: e2e-first-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fix script permissions
        run: chmod +x scripts/generate-changelog.sh scripts/notify-slack.sh

      - name: Validate package.json
        run: npm run validate:package

      - name: Install and run JS tests
        run: |
          npm install
          npm run test:js

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt
          pip install pytest jsonschema httpx

      - name: Run API tests
        run: python -m pytest tests/test_api.py -v

      - name: Prepare cloud validation fixtures
        run: |
          cp .env.cloud.example .env.cloud
          mkdir -p secrets
          for f in vault_token iot_bearer wireless_logic_token mistral_key sabionda_key; do echo dummy > "secrets/$f"; done

      - name: Validate cloud gate
        run: make validate ENV_FILE=.env.cloud PROFILES="core iot ai observability"

      - name: Generate changelog preview
        run: ./scripts/generate-changelog.sh CHANGELOG.md

      - name: Upload changelog artifact
        uses: actions/upload-artifact@v4
        with:
          name: changelog-pr-${{ github.event.pull_request.number }}
          path: CHANGELOG.md
          retention-days: 30

      - name: Commit generated changelog to branch
        if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          if git diff --quiet -- CHANGELOG.md; then
            echo "No changelog changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "docs: actualizar changelog preview del PR"
          TARGET_BRANCH="${GITHUB_HEAD_REF}"
          git push origin HEAD:"$TARGET_BRANCH"

      - name: Notify Slack
        if: ${{ failure() }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          ./scripts/notify-slack.sh "🚨 Fallo en E2E PR\n\n🔗 PR: ${{ github.event.pull_request.html_url }}\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
