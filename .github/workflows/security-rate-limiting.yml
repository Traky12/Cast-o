name: Security - Rate Limiting (deprecated)
on:
  workflow_dispatch:
jobs:
  rate-limiting:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          pip install fastapi redis slowapi
      
      - name: Test rate limiting implementation
        run: |
          python -c "
          from slowapi import Limiter
          from slowapi.util import get_remote_address
          
          limiter = Limiter(key_func=get_remote_address)
          
          # Test configuration
          iot_limit = '100/minute'
          public_limit = '500/minute'
          
          print(f'✓ IoT endpoints limited to: {iot_limit}')
          print(f'✓ Public endpoints limited to: {public_limit}')
          "
      
      - name: Run load test with Locust
        run: |
          pip install locust
          echo 'Rate limiting configuration validated'
