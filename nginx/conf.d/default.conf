# CASTUO-SYSTEM — Solo HTTP (sin certificados)
# Nginx arranca siempre. Para HTTPS: ejecuta scripts/obtener-certificado.sh
# y luego activa la config HTTPS (ver default-https.conf.example).

server {
    listen 80;
    server_name castuo-system.com 89.167.5.233;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
