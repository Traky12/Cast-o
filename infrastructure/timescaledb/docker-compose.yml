services:
  timescaledb:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      POSTGRES_DB: castuo_iot
      POSTGRES_USER: castuo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data

volumes:
  timescaledb_data:
