version: '3.9'

services:
  vault:
    image: vault:1.18.4
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: "castuo-root-token-2026"
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
      VAULT_LOG_LEVEL: "info"
    volumes:
      - vault-data:/vault/data
      - ./infrastructure/vault-integration/vault-config.hcl:/vault/config/vault.hcl
      - ./scripts/vault-init.sh:/docker-entrypoint-initdb.d/init.sh
    cap_add:
      - IPC_LOCK
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - castuo-network

  vault-unseal:
    image: vault:1.18.4
    depends_on:
      vault:
        condition: service_healthy
    environment:
      VAULT_ADDR: "http://vault:8200"
      VAULT_TOKEN: "castuo-root-token-2026"
    volumes:
      - ./scripts/vault-unseal.sh:/vault-unseal.sh
    command: sh -c "/vault-unseal.sh"
    networks:
      - castuo-network

volumes:
  vault-data:

networks:
  castuo-network:
    external: true
