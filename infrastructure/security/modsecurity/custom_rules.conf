SecRuleEngine On

# Bloquear inyecciones SQL basicas
SecRule REQUEST_FILENAME "@streq /api/auth/login" \
  "id:1001,phase:1,nolog,deny,status:403,msg:'SQL Injection Attempt'"

# Bloquear XSS
SecRule ARGS "@rx (<|%3C)[\\s\\S]*?(script|SCRIPT)" \
  "id:1002,phase:2,deny,status:403,msg:'XSS Attempt'"

# Rate Limiting (100 requests/minuto)
SecAction \
  "id:1003,\
  phase:1,\
  nolog,\
  pass,\
  initcol:ip=%{REMOTE_ADDR},\
  setvar:ip.rate_limit_counter=+1,\
  setvar:ip.rate_limit_block=+0,\
  expirevar:ip.rate_limit_counter=60,\
  expirevar:ip.rate_limit_block=60"

SecRule IP:RATE_LIMIT_COUNTER "@gt 100" \
  "id:1004,phase:1,deny,status:429,msg:'Rate Limit Exceeded'"
