# ===================================================================
# MOSQUITTO BROKER CONFIGURATION FOR CASTÚO-SYSTEM IoT
# ===================================================================

# Persistence Configuration
persistence true
persistence_location /mosquitto/data/
autosave_interval 1800  # Save DB every 30 minutes

# Logging
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type all
log_timestamp true

# Listeners
# Plain MQTT (1883)
listener 1883
protocol mqtt
allow_anonymous false
password_file /mosquitto/config/passwords.txt
max_connections -1  # Unlimited
max_queued_messages 1000

# WebSocket (9001)
listener 9001
protocol websockets
allow_anonymous false
password_file /mosquitto/config/passwords.txt

# TLS MQTT (8883) - Opcional en producción
# listener 8883
# protocol mqtt
# allow_anonymous false
# password_file /mosquitto/config/passwords.txt
# cafile /mosquitto/config/certs/ca.crt
# certfile /mosquitto/config/certs/server.crt
# keyfile /mosquitto/config/certs/server.key
# require_certificate false
# use_identity_as_username false

# ===================================================================
# ACCESS CONTROL LIST (ACL)
# ===================================================================
# Define los permisos de acceso por usuario

# Usuarios y tópicos permitidos:
# castuo (admin): control total
# sensors (IoT devices): publicar telemetría, suscribirse a comandos
# n8n (automatización): leer telemetría, escribir comandos
# monitoring (Prometheus): leer métricas

pattern read castuo/#
pattern read castuo/iot/#
pattern read castuo/iot/sensors/#
pattern read castuo/iot/telemetry
pattern read castuo/iot/commands
pattern read castuo/iot/alerts
pattern read castuo/health
pattern read castuo/monitoring/#

# Sensores IoT - publicar telemetría
pattern write castuo/iot/telemetry
pattern write castuo/iot/sensors/+/telemetry
pattern read castuo/iot/commands/+

# n8n - leer telemetría y escribir comandos
pattern read castuo/iot/telemetry
pattern read castuo/iot/sensors/+/telemetry
pattern write castuo/iot/commands/+
pattern write castuo/iot/alerts/+

# Monitoring - leer métricas
pattern read castuo/monitoring/+
pattern read castuo/health

# ===================================================================
# PERFORMANCE TUNING
# ===================================================================
max_connections -1
max_output_buffer_size 0  # Unlimited
max_inflight_messages 20
max_queued_messages 1000

# Threading
thread_count 4

# Message settings
message_size_limit 0  # Unlimited (default)
retain_available true

# Timeouts
idle_timeout 900
keepalive_interval 60
