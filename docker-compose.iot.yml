version: '3.8'

services:
  # --- Thingsdata IoT SIM Pool Manager ---
  thingsdata:
    image: thingsdata/api:latest
    container_name: castuo-thingsdata
    environment:
      # Credenciales Thingsdata
      THINGSDATA_API_KEY: "${THINGSDATA_API_KEY}"
      THINGSDATA_SECRET: "${THINGSDATA_SECRET}"
      
      # Configuración SIM Pool
      SIM_POOL: "${SIM_POOL:-1000}"
      APN: "${APN:-castuo.es}"
      
      # MQTT Bridge
      MQTT_BROKER: "mosquitto"
      MQTT_PORT: "1883"
      MQTT_TOPIC: "castuo/iot/telemetry"
      MQTT_QOS: "1"
      
      # API
      API_HOST: "0.0.0.0"
      API_PORT: "8080"
      LOG_LEVEL: "info"
    
    ports:
      - "8080:8080"  # API Thingsdata HTTP
    
    volumes:
      - ./infrastructure/thingsdata/thingsdata-config.json:/etc/thingsdata/config.json:ro
      - ./infrastructure/thingsdata/thingsdata.env:/etc/thingsdata/.env:ro
      - thingsdata_data:/data/thingsdata
    
    networks:
      - iot_network
    
    depends_on:
      mosquitto:
        condition: service_healthy
    
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s


  # --- MQTT Bridge para IoT (Mosquitto) ---
  mosquitto:
    image: eclipse-mosquitto:2.0.18
    container_name: castuo-mqtt-bridge
    
    ports:
      - "1883:1883"    # MQTT plain
      - "8883:8883"    # MQTT TLS
      - "9001:9001"    # WebSocket
    
    volumes:
      - ./infrastructure/thingsdata/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./infrastructure/thingsdata/passwords.txt:/mosquitto/config/passwords.txt:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_logs:/mosquitto/log
    
    networks:
      - iot_network
    
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pidof mosquitto >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3


  # --- n8n para Automatización IoT Thingsdata ---
  n8n:
    image: n8nio/n8n:latest
    container_name: castuo-n8n-thingsdata
    
    environment:
      # Autenticación
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: "${N8N_USER:-admin}"
      N8N_BASIC_AUTH_PASSWORD: "${N8N_PASSWORD}"
      
      # Host y URL
      N8N_HOST: "${N8N_HOST:-n8n.castuo.local}"
      N8N_PROTOCOL: "http"
      NODE_ENV: "production"
      
      # Integraciones
      THINGSDATA_API_URL: "http://thingsdata:8080/api/v1"
      THINGSDATA_API_KEY: "${THINGSDATA_API_KEY}"
      MQTT_BROKER_URL: "mqtt://mosquitto:1883"
    
    ports:
      - "5678:5678"  # n8n UI
    
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/home/node/.n8n/workflows:ro
      - ./infrastructure/thingsdata/n8n-credentials.json:/home/node/.n8n/credentials.json:ro
    
    networks:
      - iot_network
    
    depends_on:
      thingsdata:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5678/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3


  # --- PostgreSQL para almacenar telemetría + métricas Thingsdata ---
  postgres-iot:
    image: postgres:16-alpine
    container_name: castuo-postgres-iot
    
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-castuo_iot}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "castuo_telemetry"
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    
    ports:
      - "5433:5432"  # Puerto diferente del PostgreSQL principal
    
    volumes:
      - postgres_iot_data:/var/lib/postgresql/data
      - ./infrastructure/thingsdata/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    
    networks:
      - iot_network
    
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-castuo_iot} -d castuo_telemetry"]
      interval: 10s
      timeout: 5s
      retries: 5


  # --- TimescaleDB para series temporales IoT (superpotencia) ---
  timescaledb-iot:
    image: timescale/timescaledb:latest-pg16
    container_name: castuo-timescaledb-iot
    
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-castuo_iot}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "castuo_timeseries"
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    
    ports:
      - "5434:5432"  # Puerto diferente
    
    volumes:
      - timescaledb_iot_data:/var/lib/postgresql/data
      - ./infrastructure/thingsdata/timescaledb-init.sql:/docker-entrypoint-initdb.d/02-timescale.sql:ro
    
    networks:
      - iot_network
    
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-castuo_iot} -d castuo_timeseries"]
      interval: 10s
      timeout: 5s
      retries: 5


  # --- Grafana para visualizar métricas Thingsdata ---
  grafana-iot:
    image: grafana/grafana:latest
    container_name: castuo-grafana-iot
    
    environment:
      GF_SECURITY_ADMIN_USER: "${GF_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GF_ADMIN_PASSWORD}"
      GF_INSTALL_PLUGINS: "grafana-piechart-panel,grafana-worldmap-panel"
    
    ports:
      - "3001:3000"  # Grafana IoT (puerto diferente del principal)
    
    volumes:
      - grafana_iot_data:/var/lib/grafana
      - ./infrastructure/thingsdata/grafana-dashboard.json:/etc/grafana/provisioning/dashboards/grafana-dashboard.json:ro
      - ./infrastructure/thingsdata/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
    
    networks:
      - iot_network
    
    depends_on:
      - timescaledb-iot
      - postgres-iot
    
    restart: unless-stopped


volumes:
  thingsdata_data:
    driver: local
  mosquitto_data:
    driver: local
  mosquitto_logs:
    driver: local
  n8n_data:
    driver: local
  postgres_iot_data:
    driver: local
  timescaledb_iot_data:
    driver: local
  grafana_iot_data:
    driver: local


networks:
  iot_network:
    driver: bridge
