# CASTÚO-SYSTEM™ v3.0 — Logstash Pipeline
# ELK Stack: Ingesta, enriquecimiento y almacenamiento de logs
# Índice: castuo-logs-* | Retención: 30 días (RGPD)

input {
  # Logs de los microservicios vía TCP
  tcp {
    port => 5000
    codec => json_lines
    tags => ["microservice"]
  }

  # Logs de n8n workflows
  http {
    port => 5001
    codec => json
    tags => ["n8n_workflow"]
  }

  # Logs de sensores IoT LoRaWAN
  udp {
    port => 5002
    codec => json
    tags => ["iot_sensor"]
  }

  # Logs de GaiaChain
  tcp {
    port => 5003
    codec => json_lines
    tags => ["blockchain"]
  }

  # Logs de Docker via Filebeat
  beats {
    port => 5044
    tags => ["docker"]
  }
}

filter {

  # ─── Enriquecimiento común ─────────────────
  mutate {
    add_field => {
      "system" => "castuo-system"
      "sovereignty" => "EU"
      "environment" => "${ENVIRONMENT:production}"
    }
  }

  # ─── Parseo de timestamps ──────────────────
  date {
    match => ["timestamp", "ISO8601"]
    target => "@timestamp"
    remove_field => ["timestamp"]
  }

  # ─── Logs de sensores IoT ──────────────────
  if "iot_sensor" in [tags] {
    mutate {
      add_field => { "log_category" => "iot_agricultural" }
    }

    # Anonimizar NIF/CIF del operador (RGPD)
    mutate {
      gsub => ["operator_nif", "[A-Z][0-9]{8}[A-Z]?", "***NIF_REDACTED***"]
    }

    # Detectar alertas de temperatura animal
    if [metric] == "temperatura_vacuno" and [value] > 39.4 {
      mutate {
        add_tag => ["veterinary_alert"]
        add_field => { "alert_type" => "animal_fever" }
      }
    }
  }

  # ─── Logs de blockchain ────────────────────
  if "blockchain" in [tags] {
    mutate {
      add_field => { "log_category" => "blockchain_gaiachain" }
    }
  }

  # ─── Logs de workflows n8n ────────────────
  if "n8n_workflow" in [tags] {
    mutate {
      add_field => { "log_category" => "workflow_automation" }
    }
  }

  # ─── Sanitización RGPD ────────────────────
  # Eliminar datos personales de logs antes de indexar
  if [nif] {
    mutate { remove_field => ["nif"] }
  }
  if [email] {
    mutate { remove_field => ["email"] }
  }
  if [phone] {
    mutate { remove_field => ["phone"] }
  }

  # ─── GeoIP (solo IPs europeas) ────────────
  geoip {
    source => "client_ip"
    target => "geoip"
    fields => ["country_name", "country_code2", "region_name", "city_name"]
  }

  # Alertar si tráfico proviene de fuera de la UE
  if [geoip][country_code2] and [geoip][country_code2] not in ["ES", "DE", "FR", "IT", "PT", "NL", "BE", "AT", "PL", "SE", "DK", "FI", "NO", "IE", "LU"] {
    mutate {
      add_tag => ["non_eu_access"]
      add_field => { "sovereignty_alert" => "non_eu_origin" }
    }
  }

}

output {

  # ─── Elasticsearch ────────────────────────
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "castuo-logs-%{+YYYY.MM.dd}"
    document_type => "_doc"
    # ILM Policy: 30 días hot, 60 días warm, luego borrar (RGPD)
    ilm_enabled => true
    ilm_rollover_alias => "castuo-logs"
    ilm_pattern => "{now/d}-000001"
    ilm_policy => "castuo-30day-policy"
  }

  # ─── Alertas críticas a stdout ─────────────
  if "veterinary_alert" in [tags] or "non_eu_access" in [tags] {
    stdout {
      codec => rubydebug
    }
  }
}
