# CASTUO-SYSTEM — Prometheus (API + n8n + alertas)
# Ejecutar junto al stack principal: docker-compose up -d && docker-compose -f docker-compose.monitor.yml up -d
# Servicio API en el compose principal = "api" (no "backend")

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alertas.yml"

scrape_configs:
  - job_name: 'castuo-api'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['api:8000']
        labels:
          service: 'castuo-api'

  - job_name: 'castuo-n8n'
    static_configs:
      - targets: ['n8n:5678']
        labels:
          service: 'castuo-n8n'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Git + BioCoin Castúo: requiere git-exporter corriendo (ej. docker run -d -p 9091:9091 -v /ruta/castu-system:/repo prometheuscommunity/git-exporter)
  - job_name: 'git_metrics'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['host.docker.internal:9091']
        labels:
          repo: 'castu-system'
    # En Linux/Hetzner usar IP del host o nombre del contenedor si git-exporter está en la misma red

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093
