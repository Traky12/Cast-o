# ⚠️  PLANTILLA — NO SUBIR A GIT CON VALORES REALES ⚠️
#
# Pasos:
#   1. Copiar: cp k8s/secrets.example.yaml k8s/secrets.yaml
#   2. Codificar cada valor:
#        echo -n "tu_secreto_jwt"      | base64   →  JWT_SECRET
#        echo -n "0xCLAVE_HEX"        | base64   →  GAIACHAIN_PRIVATE_KEY
#        echo -n "mi_password_db"      | base64   →  DB_PASSWORD
#        echo -n "sk-mistral-xxxxx"    | base64   →  MISTRAL_API_KEY
#   3. Pegar los valores en este fichero
#   4. Aplicar: kubectl apply -f k8s/secrets.yaml -n castuo-system
#
# En producción se recomienda Vault Agent Injector en lugar de este fichero.
# Ver: infrastructure/vault/policies/quantum.hcl

apiVersion: v1
kind: Secret
metadata:
  name: castuo-secrets
  namespace: castuo-system
  labels:
    app: castuo-api
type: Opaque
data:
  # JWT — firmar tokens de autenticación API
  JWT_SECRET:             BASE64_ENCODED_JWT_SECRET_HERE

  # GaiaChain — clave privada para firmar transacciones (hex, con 0x)
  GAIACHAIN_PRIVATE_KEY:  BASE64_ENCODED_GAIACHAIN_PRIVATE_KEY_HERE

  # Base de datos PostgreSQL (si aplica)
  DB_PASSWORD:            BASE64_ENCODED_DB_PASSWORD_HERE

  # Mistral AI (opcional — si no se configura, usa reglas locales)
  MISTRAL_API_KEY:        BASE64_ENCODED_MISTRAL_API_KEY_HERE

  # Bearer IoT para telemetría cifrada (opcional)
  CASTUO_IOT_BEARER:      BASE64_ENCODED_IOT_BEARER_HERE
