# PLANTILLA — NO contiene secretos reales.
# Para usar: copia este archivo como k8s/secrets.yaml (ignorado por git)
# y codifica cada valor en base64: echo -n "valor" | base64
#
# NUNCA subas k8s/secrets.yaml a Git.
apiVersion: v1
kind: Secret
metadata:
  name: castuo-secrets
  namespace: castuo-system
type: Opaque
data:
  JWT_SECRET_KEY: "<base64: echo -n 'tu_jwt_secret' | base64>"
  GAIACHAIN_PRIVATE_KEY: "<base64: echo -n '0xTU_CLAVE_PRIVADA_HEX' | base64>"
  DB_PASSWORD: "<base64: echo -n 'tu_db_password' | base64>"
  N8N_BASIC_AUTH_USER: "<base64: echo -n 'admin' | base64>"
  N8N_BASIC_AUTH_PASSWORD: "<base64: echo -n 'tu_n8n_password' | base64>"
