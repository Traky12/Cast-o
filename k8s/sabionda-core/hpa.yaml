# CASTÚO-SYSTEM™ Sabionda Core v10.0 — Horizontal Pod Autoscaler
# Escalabilidad ilimitada: 3–50 réplicas según CPU (70% objetivo)
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sabionda-core-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sabionda-core
  minReplicas: 3
  maxReplicas: 50
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
