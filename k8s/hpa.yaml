apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: castuo-api-hpa
  namespace: castuo-system
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: castuo-api
  minReplicas: 3
  maxReplicas: 10
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: castuo-n8n-hpa
  namespace: castuo-system
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: castuo-n8n
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
