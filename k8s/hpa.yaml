apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: castuo-api-hpa
  namespace: castuo-system
  labels:
    app: castuo-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: castuo-api
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300   # espera 5 min antes de reducir
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 2
          periodSeconds: 30
