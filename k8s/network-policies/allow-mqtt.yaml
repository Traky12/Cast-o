apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-mqtt
  namespace: castuo-system
spec:
  podSelector:
    matchLabels:
      app: mqtt
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: api
    - podSelector:
        matchLabels:
          app: frontend
    ports:
    - protocol: TCP
      port: 1883
