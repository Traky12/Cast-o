# CASTÚO-SYSTEM™ — Políticas Zero Trust para Cursor (PodSecurityPolicy + Webhook)
# PodSecurityPolicy deprecada en K8s 1.25+; usar Pod Security Standards en namespace.
apiVersion: policy/v1beta1
kind: PodSecurityPolicy
metadata:
  name: cursor-zero-trust
spec:
  privileged: false
  allowPrivilegeEscalation: false
  requiredDropCapabilities:
    - ALL
  volumes:
    - configMap
    - emptyDir
    - secret
  hostNetwork: false
  hostIPC: false
  hostPID: false
  runAsUser:
    rule: MustRunAsNonRoot
  seLinux:
    rule: RunAsAny
  supplementalGroups:
    rule: MustRunAs
    ranges:
      - min: 1
        max: 65535
  fsGroup:
    rule: MustRunAs
    ranges:
      - min: 1
        max: 65535
  readOnlyRootFilesystem: true
---
# ValidatingWebhook: sustituir <CA_BUNDLE> por el base64 del CA del servidor de validación
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: cursor-validation
webhooks:
- name: cursor-validation.gaiachain.castuo-system.com
  rules:
  - operations: ["CREATE", "UPDATE"]
    apiGroups: [""]
    apiVersions: ["v1"]
    resources: ["pods"]
    scope: "*"
  clientConfig:
    service:
      namespace: cursor-sandbox
      name: cursor-validator
      path: /validate
    caBundle: Cg==   # Sustituir por CA bundle real en base64
  admissionReviewVersions: ["v1"]
  sideEffects: None
  timeoutSeconds: 5
