apiVersion: v1
kind: Service
metadata:
  name: castuo-api-service
  namespace: castuo-system
  labels:
    app: castuo-api
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8000"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  selector:
    app: castuo-api
  ports:
    - name: http
      port: 80
      targetPort: 8000
      protocol: TCP
