apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agroedu-ingress
  namespace: education
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
  - hosts:
    - agroedu.yourdomain.eu
    secretName: agroedu-tls
  rules:
  - host: agroedu.yourdomain.eu
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: agroedu-service
            port:
              number: 80
