apiVersion: v1
kind: Service
metadata:
  name: castuo-frontend-service
  namespace: castuo-system
  labels:
    app: castuo-frontend
spec:
  selector:
    app: castuo-frontend
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 3000
  type: ClusterIP

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: castuo-frontend
  namespace: castuo-system
  labels:
    app: castuo-frontend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: castuo-frontend
  template:
    metadata:
      labels:
        app: castuo-frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/castuo-system/frontend:v9.2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              protocol: TCP
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"