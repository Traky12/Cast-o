---
# CASTÚO-SYSTEM™ v3.1 — Frontend Raíz Dedicado
# ─────────────────────────────────────────────────────────────────────────────
# Panel de control web servido por nginx en castuo-system.cloud (raíz).
# Imagen por defecto: ghcr.io/traky12/castuo-system/frontend:latest
#   - Sirve index.html estático con dashboard de usabilidad
#   - Proxea /api/* hacia castuo-api-service (para tests locales en cluster)
# ─────────────────────────────────────────────────────────────────────────────

# ─── ConfigMap: página principal + configuración nginx ────────────────────────

apiVersion: v1
kind: ConfigMap
metadata:
  name: castuo-frontend-config
  namespace: castuo-system
  labels:
    app: castuo-frontend
data:
  API_URL: "https://api.castuo-system.cloud"
  N8N_URL: "https://n8n.castuo-system.cloud"
  ENVIRONMENT: "production"

  nginx.conf: |
    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Seguridad
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-Content-Type-Options "nosniff";

        # Compresión
        gzip on;
        gzip_types text/html text/css application/javascript application/json;

        # SPA routing: todas las rutas sirven index.html
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Health check interno
        location /nginx-health {
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        # Cache de assets estáticos
        location ~* \.(js|css|png|jpg|svg|ico|woff2)$ {
            expires 7d;
            add_header Cache-Control "public, immutable";
        }
    }

---
# ─── Deployment Frontend ──────────────────────────────────────────────────────

apiVersion: apps/v1
kind: Deployment
metadata:
  name: castuo-frontend
  namespace: castuo-system
  labels:
    app: castuo-frontend
    component: frontend
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: castuo-frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: castuo-frontend
        version: "pr19"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101    # nginx user
        fsGroup: 101
      containers:
        - name: frontend
          # Usar imagen propia si existe; si no, nginx:alpine sirve el ConfigMap HTML
          image: ghcr.io/traky12/castuo-system/frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              name: http
          envFrom:
            - configMapRef:
                name: castuo-frontend-config
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: nginx.conf
          resources:
            requests:
              cpu:    "50m"
              memory: "64Mi"
            limits:
              cpu:    "200m"
              memory: "128Mi"
          livenessProbe:
            httpGet:
              path: /nginx-health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /nginx-health
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false   # nginx necesita escribir en /var/cache/nginx
            capabilities:
              drop: [ALL]
              add: [NET_BIND_SERVICE]

      volumes:
        - name: nginx-config
          configMap:
            name: castuo-frontend-config
            items:
              - key: nginx.conf
                path: nginx.conf

      imagePullSecrets:
        - name: ghcr-credentials

      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values: [castuo-frontend]
                topologyKey: kubernetes.io/hostname

---
# ─── Service Frontend ─────────────────────────────────────────────────────────

apiVersion: v1
kind: Service
metadata:
  name: castuo-frontend-service
  namespace: castuo-system
  labels:
    app: castuo-frontend
    component: frontend
spec:
  type: ClusterIP
  selector:
    app: castuo-frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP

---
# ─── n8n Service + Deployment ─────────────────────────────────────────────────
# n8n expone port 5678 en el pod; el Service lo mapea a 80 (Ingress usa port 80).

apiVersion: v1
kind: Service
metadata:
  name: castuo-n8n-service
  namespace: castuo-system
  labels:
    app: castuo-n8n
    component: workflows
spec:
  type: ClusterIP
  selector:
    app: castuo-n8n
  ports:
    - name: http
      port: 80
      targetPort: 5678
      protocol: TCP

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: castuo-n8n
  namespace: castuo-system
  labels:
    app: castuo-n8n
    component: workflows
spec:
  replicas: 1
  selector:
    matchLabels:
      app: castuo-n8n
  template:
    metadata:
      labels:
        app: castuo-n8n
    spec:
      securityContext:
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: n8n
          image: n8nio/n8n:1.30
          ports:
            - containerPort: 5678
              name: http
          env:
            - name: N8N_HOST
              value: "n8n.castuo-system.cloud"
            - name: N8N_PROTOCOL
              value: "https"
            - name: WEBHOOK_URL
              value: "https://n8n.castuo-system.cloud"
            - name: GENERIC_TIMEZONE
              value: "Europe/Madrid"
            - name: N8N_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: castuo-secrets
                  key: N8N_ENCRYPTION_KEY
                  optional: true
            - name: N8N_BASIC_AUTH_ACTIVE
              value: "true"
            - name: N8N_BASIC_AUTH_USER
              valueFrom:
                secretKeyRef:
                  name: castuo-secrets
                  key: N8N_USER
                  optional: true
            - name: N8N_BASIC_AUTH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: castuo-secrets
                  key: N8N_PASSWORD
                  optional: true
          volumeMounts:
            - name: n8n-data
              mountPath: /home/node/.n8n
          resources:
            requests:
              cpu:    "100m"
              memory: "256Mi"
            limits:
              cpu:    "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 5678
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: 5678
            initialDelaySeconds: 10
            periodSeconds: 10

      volumes:
        - name: n8n-data
          persistentVolumeClaim:
            claimName: castuo-n8n-pvc

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: castuo-n8n-pvc
  namespace: castuo-system
  labels:
    app: castuo-n8n
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: hcloud-volumes
  resources:
    requests:
      storage: 5Gi
