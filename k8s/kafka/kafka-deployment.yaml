---
# ─────────────────────────────────────────────────────────────────────────────
# CASTÚO-SYSTEM™ v3.1 — Kafka + Zookeeper
# Namespace: castuo-system
# Mensajería asíncrona para eventos entre Claude, GitHub, Mistral, IoT y GaiaChain
# ─────────────────────────────────────────────────────────────────────────────

# ─── Zookeeper ────────────────────────────────────────────────────────────────

apiVersion: apps/v1
kind: Deployment
metadata:
  name: zookeeper
  namespace: castuo-system
  labels:
    app: zookeeper
    component: messaging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zookeeper
  template:
    metadata:
      labels:
        app: zookeeper
    spec:
      containers:
        - name: zookeeper
          image: confluentinc/cp-zookeeper:7.5.0
          ports:
            - containerPort: 2181
          env:
            - name: ZOOKEEPER_CLIENT_PORT
              value: "2181"
            - name: ZOOKEEPER_TICK_TIME
              value: "2000"
          resources:
            requests:
              cpu:    "100m"
              memory: "256Mi"
            limits:
              cpu:    "500m"
              memory: "512Mi"
          livenessProbe:
            exec:
              command: ["sh", "-c", "echo ruok | nc localhost 2181 | grep imok"]
            initialDelaySeconds: 30
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: zookeeper
  namespace: castuo-system
spec:
  selector:
    app: zookeeper
  ports:
    - port: 2181
      targetPort: 2181
  type: ClusterIP

---
# ─── Kafka (3 réplicas para producción) ─────────────────────────────────────

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kafka-pvc
  namespace: castuo-system
  labels:
    app: kafka
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: hcloud-volumes
  resources:
    requests:
      storage: 20Gi

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: castuo-system
  labels:
    app: kafka
    component: messaging
spec:
  serviceName: kafka-headless
  replicas: 3
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port:   "9308"
    spec:
      containers:
        - name: kafka
          image: confluentinc/cp-kafka:7.5.0
          ports:
            - containerPort: 9092
              name: kafka
            - containerPort: 9093
              name: controller
          env:
            - name: KAFKA_BROKER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: KAFKA_ZOOKEEPER_CONNECT
              value: "zookeeper.castuo-system.svc.cluster.local:2181"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://:9092"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "PLAINTEXT:PLAINTEXT"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "3"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "3"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "2"
            - name: KAFKA_DEFAULT_REPLICATION_FACTOR
              value: "3"
            - name: KAFKA_MIN_INSYNC_REPLICAS
              value: "2"
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "true"
            - name: KAFKA_LOG_RETENTION_HOURS
              value: "168"    # 7 días
            - name: KAFKA_LOG_SEGMENT_BYTES
              value: "1073741824"  # 1 GB
          volumeMounts:
            - name: kafka-data
              mountPath: /var/lib/kafka/data
          resources:
            requests:
              cpu:    "500m"
              memory: "1Gi"
            limits:
              cpu:    "2000m"
              memory: "4Gi"
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - kafka-broker-api-versions --bootstrap-server localhost:9092
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
        # Kafka Exporter para Prometheus
        - name: kafka-exporter
          image: danielqsj/kafka-exporter:v1.7.0
          ports:
            - containerPort: 9308
          args:
            - --kafka.server=localhost:9092
          resources:
            requests:
              cpu:  "50m"
              memory: "64Mi"
            limits:
              cpu:  "200m"
              memory: "128Mi"
  volumeClaimTemplates:
    - metadata:
        name: kafka-data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: hcloud-volumes
        resources:
          requests:
            storage: 20Gi

---
# Headless service para StatefulSet
apiVersion: v1
kind: Service
metadata:
  name: kafka-headless
  namespace: castuo-system
  labels:
    app: kafka
spec:
  clusterIP: None
  selector:
    app: kafka
  ports:
    - port: 9092
      name: kafka

---
# Service interno para clientes
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: castuo-system
  labels:
    app: kafka
spec:
  selector:
    app: kafka
  ports:
    - port: 9092
      targetPort: 9092
      name: kafka
  type: ClusterIP

---
# ─── Topics predefinidos vía Job ─────────────────────────────────────────────

apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-topic-init
  namespace: castuo-system
  labels:
    component: messaging
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: topic-init
          image: confluentinc/cp-kafka:7.5.0
          command:
            - sh
            - -c
            - |
              echo "Esperando a Kafka..."
              sleep 30
              KAFKA=kafka.castuo-system.svc.cluster.local:9092
              for TOPIC in code_updates ai_events sensor_alerts blockchain_events model_updates; do
                kafka-topics --bootstrap-server $KAFKA --create --if-not-exists \
                  --topic $TOPIC --replication-factor 3 --partitions 6 \
                  --config retention.ms=604800000 || true
                echo "Topic $TOPIC OK"
              done
          resources:
            requests:
              cpu:  "100m"
              memory: "128Mi"
