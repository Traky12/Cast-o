apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: castuo-holo-api-restricted
  namespace: castuo-system
spec:
  podSelector:
    matchLabels:
      app: castuo-holo-api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: castuo-n8n
        - podSelector:
            matchLabels:
              app: castuo-api
      ports:
        - protocol: TCP
          port: 8000
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: castuo-api
      ports:
        - protocol: TCP
          port: 8000
    - to:
        - podSelector:
            matchLabels:
              app: mqtt-broker
      ports:
        - protocol: TCP
          port: 1883
    - to:
        - podSelector:
            matchLabels:
              app: timescaledb
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
