apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: castuo-ingress
  namespace: castuo-system
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - castuo-system.cloud
        - api.castuo-system.cloud
        - n8n.castuo-system.cloud
        - www.castuo-system.cloud
      secretName: castuo-tls
  rules:
    - host: castuo-system.cloud
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: castuo-api-service
                port:
                  number: 80
    - host: www.castuo-system.cloud
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: castuo-api-service
                port:
                  number: 80
    - host: api.castuo-system.cloud
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: castuo-api-service
                port:
                  number: 80
    - host: n8n.castuo-system.cloud
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: castuo-n8n-service
                port:
                  number: 80
