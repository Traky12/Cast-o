apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ndvi-api-hpa
  namespace: castuo-system
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ndvi-api
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ndvi-worker-hpa
  namespace: castuo-system
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ndvi-worker
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

