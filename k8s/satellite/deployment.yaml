apiVersion: apps/v1
kind: Deployment
metadata:
  name: stac-ingestion
  namespace: castuo-system
  labels:
    app: stac-ingestion
spec:
  replicas: 2
  selector:
    matchLabels:
      app: stac-ingestion
  template:
    metadata:
      labels:
        app: stac-ingestion
    spec:
      containers:
        - name: stac-ingestion
          image: registry.castuo-system.cloud/stac-ingestion:latest
          command: ["python", "ingestion/stac_worker.py"]
          envFrom:
            - configMapRef:
                name: castuo-satellite-config
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ndvi-worker
  namespace: castuo-system
  labels:
    app: ndvi-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ndvi-worker
  template:
    metadata:
      labels:
        app: ndvi-worker
    spec:
      containers:
        - name: ndvi-worker
          image: registry.castuo-system.cloud/ndvi-worker:latest
          command:
            ["python", "analytics/ndvi_worker.py", "/data/raw/sample.tif", "/data/ndvi/sample_ndvi.tif"]
          envFrom:
            - configMapRef:
                name: castuo-satellite-config
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"

