---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ndvi-api
  namespace: castuo-system
  labels:
    app: ndvi-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ndvi-api
  template:
    metadata:
      labels:
        app: ndvi-api
    spec:
      containers:
        - name: ndvi-api
          image: registry.castuo-system.cloud/ndvi-api:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: castuo-satellite-config
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "300m"
              memory: "512Mi"
