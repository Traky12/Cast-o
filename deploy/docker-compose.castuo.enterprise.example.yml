# Stack de referencia: CASTÚO API (FastAPI + LangGraph) + n8n + PostgreSQL + Redis.
# Hetzner u otro VPS. No incluye "Mistral proxy" tipo Ollama salvo que lo añadas tú: Mistral EU suele ser API HTTPS.
#
# Desde la raíz del repo:
#   cp deploy/.env.castuo-enterprise.example deploy/.env.castuo-enterprise
#   docker compose -f deploy/docker-compose.castuo.enterprise.example.yml --env-file deploy/.env.castuo-enterprise up -d --build
#
# Traefik/nginx TLS y DNS (n8n.castuo-system.es, api.…) van fuera de este archivo.

version: "3.8"

networks:
  castuo_ent:
    driver: bridge

volumes:
  pg_data:
  redis_data:
  n8n_ent_data:

services:
  postgres:
    image: postgres:15-alpine
    container_name: castuo-ent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: n8n
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks: [castuo_ent]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d n8n"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: castuo-ent-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks: [castuo_ent]

  castuo-api:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: castuo-ent-api
    restart: unless-stopped
    ports:
      - "${CASTUO_API_PORT:-8000}:8000"
    environment:
      CASTUO_APP_VERSION: ${CASTUO_APP_VERSION:-enterprise-1.0}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      MISTRAL_LANGGRAPH_MODEL: ${MISTRAL_LANGGRAPH_MODEL:-mistral-small-latest}
      GAIACHAIN_REGISTER_URL: ${GAIACHAIN_REGISTER_URL:-}
      N8N_GAIACHAIN_API_KEY: ${N8N_GAIACHAIN_API_KEY:-}
      GAIACHAIN_API_KEY: ${GAIACHAIN_API_KEY:-}
      SLACK_WEBHOOK: ${SLACK_WEBHOOK:-}
      LANGCHAIN_TRACING_V2: ${LANGCHAIN_TRACING_V2:-false}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGCHAIN_PROJECT: ${LANGCHAIN_PROJECT:-CASTUO-AGRI-BRAIN}
      LANGCHAIN_ENDPOINT: ${LANGCHAIN_ENDPOINT:-https://api.smith.langchain.com}
    networks: [castuo_ent]

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: castuo-ent-n8n
    restart: unless-stopped
    ports:
      - "${N8N_PORT:-5678}:5678"
    environment:
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      WEBHOOK_URL: ${WEBHOOK_URL:-http://localhost:5678/}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-Europe/Madrid}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?set N8N_ENCRYPTION_KEY}
      N8N_BASIC_AUTH_ACTIVE: ${N8N_BASIC_AUTH_ACTIVE:-true}
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER:-admin}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_PASSWORD:?set N8N_PASSWORD}
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-postgres}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:?}
      CASTUO_BASE_URL: http://castuo-api:8000
      CASTUO_API_URL: http://castuo-api:8000
      CASTUO_API_KEY: ${CASTUO_API_KEY:-}
      CASTUO_ORCHESTRATOR_KEY: ${CASTUO_ORCHESTRATOR_KEY:-}
      CASTUO_ZONE_ID: ${CASTUO_ZONE_ID:-zone_default}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
    volumes:
      - n8n_ent_data:/home/node/.n8n
      - ../n8n/workflows:/workflows:ro
    networks: [castuo_ent]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      castuo-api:
        condition: service_started
