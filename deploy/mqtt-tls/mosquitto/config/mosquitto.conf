# Mosquitto 2.0 — producción (1883 + 8883 TLS)
# Certificados: deploy/mqtt-tls/scripts/gen-certs.sh
# mTLS: ver mosquitto.conf.mtls.example

per_listener_settings true

# 1883: el mapeo Docker 127.0.0.1:1883:1883 ya restringe en el host.
# Dentro del contenedor el listener debe estar en 0.0.0.0 para que el publish del puerto funcione.
listener 1883 0.0.0.0
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl.conf

listener 8883
protocol mqtt
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl.conf
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
cafile /mosquitto/certs/ca.crt
# TLS + usuario/contraseña (sin certificado de cliente por defecto)
require_certificate false
# mTLS: require_certificate true + use_identity_as_username true (ver .mtls.example)
# Una sola directiva tls_version por listener en Mosquitto 2.0.x
tls_version tlsv1.2

persistence true
persistence_location /mosquitto/data/
autosave_interval 300

max_connections 500

log_dest file /mosquitto/log/mosquitto.log
log_type all
