# Fragmento: variables y secretos para el Deployment del API CASTÚO (LangGraph usa las mismas).
# kubectl create secret generic castuo-api-keys --from-literal=mistral=... --from-literal=gaiachain=...
apiVersion: apps/v1
kind: Deployment
metadata:
  name: castuo-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: castuo-api
  template:
    metadata:
      labels:
        app: castuo-api
    spec:
      containers:
        - name: api
          image: ghcr.io/tu-org/castuo-api:latest
          ports:
            - containerPort: 8000
          env:
            - name: MISTRAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: castuo-api-keys
                  key: mistral
                  optional: true
            - name: GAIACHAIN_REGISTER_URL
              value: ""
            - name: N8N_GAIACHAIN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: castuo-api-keys
                  key: gaiachain
                  optional: true
            - name: SLACK_WEBHOOK
              valueFrom:
                secretKeyRef:
                  name: castuo-api-keys
                  key: slack_webhook
                  optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: castuo-api
spec:
  selector:
    app: castuo-api
  ports:
    - port: 8000
      targetPort: 8000
