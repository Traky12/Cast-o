# Plantilla de ejemplo — NO usar allow_anonymous true en producción.
# Copiar a mosquitto.edge.conf y definir password_file + listener TLS (8883) si exponeis el broker.

listener 1883
allow_anonymous false
# password_file /mosquitto/config/passwd

persistence true
persistence_location /mosquitto/data/

# Ajustar según política: max_connections, message_size_limit, etc.
