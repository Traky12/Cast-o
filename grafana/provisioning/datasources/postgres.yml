apiVersion: 1

datasources:
  - name: PostgreSQL_CTAEX
    uid: castuo-pg
    type: postgres
    url: ${POSTGRES_HOST:-db.ctaex.es}:5432
    database: ${POSTGRES_DB:-castuo_system}
    user: grafana_reader
    secureJsonData:
      password: ${GRAFANA_PG_PASSWORD:-changeme}
    jsonData:
      sslmode: require
      postgresVersion: 1500
      timescaledb: false
      maxOpenConns: 10
      maxIdleConns: 5
      connMaxLifetime: 14400
    editable: true
    isDefault: true
