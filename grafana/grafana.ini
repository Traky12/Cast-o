# CASTÚO-SYSTEM™ v3.1 — Grafana Configuration

[server]
http_port = 3001
domain = grafana.ctaex.es
root_url = https://grafana.ctaex.es

[database]
type = sqlite3
path = /var/lib/grafana/grafana.db

[datasources]
datasource_timeout = 60

[security]
admin_user = admin
admin_password = ${GRAFANA_ADMIN_PASSWORD:-changeme}
secret_key = ${GRAFANA_SECRET:-changeme_in_production}
disable_gravatar = true

[users]
allow_sign_up = false
allow_org_create = false

[auth.anonymous]
enabled = false

[smtp]
enabled = false

[log]
mode = console
level = info

[paths]
provisioning = /etc/grafana/provisioning

[unified_alerting]
enabled = true

[feature_toggles]
enable = publicDashboards
